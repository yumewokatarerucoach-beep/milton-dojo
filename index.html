<meta charset="utf-8">
<title>ミルトン道場</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2B4B8C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ミルトン道場">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="icon" href="icon.svg" type="image/svg+xml">

<style>
:root{
  --ground:#EDEFF4; --surface:#FFFFFF; --surface-2:#F5F7FB;
  --line:#D3D9E6; --line-soft:#E4E8F1;
  --ink:#171C2B; --ink-2:#4A5266; --ink-3:#767E92;
  --accent:#2B4B8C; --accent-soft:#E6ECF8; --accent-ink:#1E3567; --on-accent:#FFFFFF;
  --good:#2C6E5D; --good-soft:#DEEDE7;
  --mid:#8F6416;  --mid-soft:#F4EAD4;
  --weak:#9C4234; --weak-soft:#F6E2DE;
  --shadow:0 1px 2px rgba(23,28,43,.05), 0 6px 18px -10px rgba(23,28,43,.18);
  /* 端末に入っている書体だけを使う（外部読み込みなし＝オフラインでも同じ見え方） */
  --serif:"Hiragino Mincho ProN", "HiraMinProN-W3", "Yu Mincho", "YuMincho", "Noto Serif JP", "Noto Serif CJK JP", "Source Han Serif JP", "Source Han Serif", "MS PMincho", serif;
  --sans:"Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", "YuGothic", "Noto Sans JP", "Meiryo", system-ui, sans-serif;
  --mono:ui-monospace, SFMono-Regular, Menlo, Consolas, "Courier New", monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#111420; --surface:#191D2B; --surface-2:#1F2434;
    --line:#2F3648; --line-soft:#262C3C;
    --ink:#E7EAF2; --ink-2:#A9B0C4; --ink-3:#7C8397;
    --accent:#8CA8DE; --accent-soft:#1D2740; --accent-ink:#BACCEE; --on-accent:#111420;
    --good:#6FC0A6; --good-soft:#16302A;
    --mid:#D9AC59;  --mid-soft:#332A16;
    --weak:#DF8C7C; --weak-soft:#33201C;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --ground:#111420; --surface:#191D2B; --surface-2:#1F2434;
  --line:#2F3648; --line-soft:#262C3C;
  --ink:#E7EAF2; --ink-2:#A9B0C4; --ink-3:#7C8397;
  --accent:#8CA8DE; --accent-soft:#1D2740; --accent-ink:#BACCEE; --on-accent:#111420;
  --good:#6FC0A6; --good-soft:#16302A;
  --mid:#D9AC59;  --mid-soft:#332A16;
  --weak:#DF8C7C; --weak-soft:#33201C;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.6);
}

*{box-sizing:border-box}
/* 文字サイズ：基準は端末幅で CSS が決め、--fs-scale（ユーザー設定）を掛ける */
html{font-size:calc(16px * var(--fs-scale, 1))}
@media (max-width:640px){html{font-size:calc(20px * var(--fs-scale, 1))}}   /* スマホは初めから大きめ */
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:var(--sans); font-size:1rem; line-height:1.78;
  -webkit-text-size-adjust:100%; text-size-adjust:100%;
}
.wrap{max-width:660px; margin:0 auto; padding:20px 16px 72px; display:flex; flex-direction:column; gap:20px}
h1,h2,h3{margin:0; text-wrap:balance; font-weight:700}

/* ---- masthead ---- */
.masthead{display:flex; align-items:baseline; justify-content:space-between; gap:12px; padding-bottom:14px; border-bottom:1px solid var(--line)}
.brand{font-family:var(--serif); font-size:1.45rem; letter-spacing:.02em; line-height:1.3}
.brand small{display:block; font-family:var(--mono); font-size:.70rem; letter-spacing:.16em; color:var(--ink-3); font-weight:400; margin-top:2px}
.themebtn{font-family:var(--mono); font-size:.75rem; letter-spacing:.08em; color:var(--ink-3); background:none; border:1px solid var(--line); border-radius:999px; padding:4px 10px; cursor:pointer}
.themebtn:hover{color:var(--ink-2); border-color:var(--ink-3)}

/* ---- generic ---- */
.card{background:var(--surface); border:1px solid var(--line-soft); border-radius:12px; padding:18px; box-shadow:var(--shadow)}
.eyebrow{font-family:var(--mono); font-size:.74rem; letter-spacing:.16em; text-transform:uppercase; color:var(--ink-3)}
.muted{color:var(--ink-2); font-size:.92rem; line-height:1.7}
.hr{height:1px; background:var(--line-soft); border:0; margin:0}

button{font-family:inherit}
.btn{
  display:block; width:100%; padding:14px 18px; border-radius:10px; border:1px solid transparent;
  background:var(--accent); color:var(--on-accent); font-size:1rem; font-weight:700; cursor:pointer; line-height:1.4;
}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent; color:var(--ink-2); border-color:var(--line); font-weight:500}
.btn.ghost:hover{border-color:var(--ink-3); color:var(--ink); filter:none}
.btn.sm{padding:9px 14px; font-size:.91rem; width:auto}
.btnrow{display:flex; gap:10px; flex-wrap:wrap}
.btnrow .btn{flex:1 1 auto; width:auto}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

/* ---- home: mode list ---- */
.modes{display:flex; flex-direction:column; gap:10px}
.mode{
  display:grid; grid-template-columns:auto 1fr; gap:2px 14px; align-items:start;
  width:100%; text-align:left; padding:16px; border-radius:12px; cursor:pointer;
  background:var(--surface); border:1px solid var(--line-soft); box-shadow:var(--shadow); color:inherit;
}
.mode:hover{border-color:var(--accent)}
.mode .mk{grid-row:1/3; font-family:var(--mono); font-size:.79rem; font-weight:600; color:var(--accent);
  background:var(--accent-soft); border-radius:6px; padding:6px 8px; letter-spacing:.06em}
.mode b{font-size:1.02rem; font-weight:700}
.mode span{font-size:.89rem; color:var(--ink-2); line-height:1.65}

/* ---- timer selector ---- */
.seg{display:flex; gap:0; border:1px solid var(--line); border-radius:9px; overflow:hidden}
.seg button{flex:1; padding:9px 4px; background:var(--surface); border:0; border-right:1px solid var(--line);
  font-family:var(--mono); font-size:.85rem; color:var(--ink-2); cursor:pointer}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent); color:var(--on-accent)}

.setrow{display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap}
.setrow .seg{flex:1 1 220px}

/* ---- drill ---- */
.stepbar{display:flex; align-items:center; gap:10px; font-family:var(--mono); font-size:.74rem; letter-spacing:.1em; color:var(--ink-3)}
.stepbar .dot{width:5px; height:5px; border-radius:50%; background:var(--line)}
.stepbar .dot.on{background:var(--accent)}
.stepbar .sp{flex:1}

.utter{
  background:var(--surface); border:1px solid var(--line-soft); border-left:3px solid var(--accent);
  border-radius:4px 12px 12px 4px; padding:20px 20px 18px; box-shadow:var(--shadow);
}
.utter .who{font-family:var(--mono); font-size:.73rem; letter-spacing:.16em; color:var(--ink-3); margin-bottom:8px}
.utter p{margin:0; font-family:var(--serif); font-size:1.16rem; line-height:1.95; font-weight:600}

.task{background:var(--accent-soft); border-radius:12px; padding:16px 18px; display:flex; flex-direction:column; gap:6px}
.task .lbl{font-family:var(--mono); font-size:.73rem; letter-spacing:.16em; color:var(--accent); text-transform:uppercase}
.task h2{font-size:1.06rem; color:var(--accent-ink)}
.task .form{font-size:.92rem; color:var(--ink-2); line-height:1.7}
.task .form code{font-family:var(--mono); font-size:.82em; background:var(--surface); padding:1px 5px; border-radius:4px}

.speak{display:flex; align-items:center; gap:10px; font-size:.91rem; color:var(--ink-2); padding:0 2px}
.speak .n{font-family:var(--mono); font-size:.7rem; color:var(--accent); border:1px solid var(--accent); border-radius:50%; width:19px; height:19px; display:grid; place-items:center; flex:none}
.hintbox{background:var(--mid-soft); border-radius:11px; padding:14px 16px; display:flex; flex-direction:column; gap:7px}
.hintbox .lbl{font-family:var(--mono); font-size:.74rem; letter-spacing:.14em; text-transform:uppercase; color:var(--mid)}
.hintbox .bd{font-size:.96rem; line-height:1.9}
.hintbox .bd code{font-family:var(--mono); font-size:.86em; background:var(--surface); padding:1px 5px; border-radius:4px}
.hintbox .sk{display:block; margin-top:4px; font-size:.88rem; color:var(--ink-2)}
.shakyo{background:var(--good-soft); border-radius:11px; padding:16px; display:flex; flex-direction:column; gap:11px}
.shakyo .lbl{font-family:var(--mono); font-size:.74rem; letter-spacing:.14em; text-transform:uppercase; color:var(--good)}
.shakyo .say{font-family:var(--serif); font-size:1.06rem; font-weight:600; line-height:1.95}
.shakyo .how{font-size:.9rem; color:var(--ink-2); line-height:1.8}
.mono{background:var(--surface); border:1px solid var(--line-soft); border-radius:12px; padding:18px; box-shadow:var(--shadow);
  font-family:var(--serif); font-size:1.02rem; line-height:2.15; font-weight:600; max-height:44vh; overflow-y:auto}
.mono .who{font-family:var(--mono); font-size:.73rem; letter-spacing:.16em; color:var(--ink-3); font-weight:400; margin-bottom:9px}
.mono .dim{color:var(--ink-3); font-weight:500}
.mono mark.spot{background:var(--mid-soft); color:var(--ink); padding:2px 3px; border-radius:3px;
  box-shadow:0 1px 0 var(--mid), 0 -1px 0 var(--mid)}
.pgrid{display:grid; grid-template-columns:repeat(auto-fill, minmax(150px,1fr)); gap:7px}
.pgrid button{padding:11px 10px; border-radius:9px; border:1px solid var(--line); background:var(--surface); color:var(--ink-2);
  font-family:inherit; font-size:.9rem; line-height:1.45; cursor:pointer; text-align:left}
.pgrid button:hover{border-color:var(--accent); color:var(--ink)}
.pgrid button[aria-pressed="true"]{border-color:var(--accent); background:var(--accent-soft); color:var(--accent-ink); font-weight:700}
.pgrid button .c{display:block; font-family:var(--mono); font-size:.72rem; color:var(--ink-3); letter-spacing:.06em}
.pgrid button[aria-pressed="true"] .c{color:var(--accent)}
.pickres{display:flex; gap:12px; align-items:flex-start; padding:14px 16px; border-radius:11px; border:1px solid var(--line-soft); background:var(--surface)}
.pickres .g{font-size:1.4rem; line-height:1.2; flex:none}
.pickres .t{font-size:.92rem; line-height:1.7; color:var(--ink-2)}
.pickres .t b{display:block; color:var(--ink); font-size:1.02rem}
.progress{display:flex; gap:4px; align-items:center}
.progress i{flex:1; height:4px; border-radius:999px; background:var(--line-soft)}
.progress i.done{background:var(--good)} .progress i.now{background:var(--accent)}
.alsobox{font-size:.9rem; color:var(--ink-2); line-height:1.75; background:var(--surface-2); border-radius:9px; padding:11px 13px}
.alsobox b{color:var(--ink)}
.lvnote{font-size:.85rem; color:var(--ink-3); line-height:1.7}
.mictip{font-size:.86rem; color:var(--ink-3); line-height:1.75; padding:2px 0 2px 13px; border-left:2px solid var(--line)}
.mictip b{color:var(--ink-2); font-weight:700}

textarea{
  width:100%; min-height:110px; resize:vertical; padding:14px; border-radius:10px;
  border:1px solid var(--line); background:var(--surface); color:var(--ink);
  font-family:var(--sans); font-size:1rem; line-height:1.8;
}
textarea::placeholder{color:var(--ink-3)}

.timer{display:flex; align-items:center; gap:10px; justify-content:space-between}
.timer .num{font-family:var(--mono); font-size:1.5rem; font-weight:600; font-variant-numeric:tabular-nums; color:var(--ink-2)}
.timer .num.low{color:var(--weak)}
.timer .bar{flex:1; height:3px; background:var(--line-soft); border-radius:999px; overflow:hidden}
.timer .bar i{display:block; height:100%; background:var(--accent); transition:width .95s linear}
.timer .msg{font-size:.87rem; color:var(--weak)}

/* ---- review ---- */
.model{background:var(--surface); border:1px solid var(--line-soft); border-radius:12px; padding:18px; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:14px}
.model h3{font-size:.85rem; font-family:var(--mono); letter-spacing:.14em; text-transform:uppercase; color:var(--ink-3); font-weight:400}
.model ul{margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:12px}
.model li{font-family:var(--serif); font-size:1.04rem; line-height:1.9; font-weight:600; padding-left:16px; border-left:2px solid var(--good)}
.model li mark{background:var(--mid-soft); color:var(--ink); padding:0 3px; border-radius:3px; font-weight:700}
.point{font-size:.92rem; color:var(--ink-2); line-height:1.8; background:var(--surface-2); border-radius:9px; padding:12px 14px}
.point b{color:var(--ink); font-weight:700}

.checks{display:flex; flex-direction:column; gap:8px}
.chk{
  display:flex; gap:12px; align-items:flex-start; text-align:left; width:100%;
  padding:13px 15px; border-radius:10px; border:1px solid var(--line); background:var(--surface);
  color:var(--ink-2); font-size:.95rem; line-height:1.7; cursor:pointer;
}
.chk .box{flex:none; width:20px; height:20px; border-radius:5px; border:1.5px solid var(--line); margin-top:2px;
  display:grid; place-items:center; font-size:.79rem; color:transparent}
.chk[aria-pressed="true"]{border-color:var(--good); background:var(--good-soft); color:var(--ink)}
.chk[aria-pressed="true"] .box{background:var(--good); border-color:var(--good); color:var(--surface)}

.verdict{display:flex; align-items:center; gap:14px; padding:16px 18px; border-radius:12px; border:1px solid var(--line-soft); background:var(--surface)}
.verdict .g{font-family:var(--serif); font-size:2rem; line-height:1; font-weight:700; width:44px; text-align:center; flex:none}
.verdict .t{font-size:.93rem; color:var(--ink-2); line-height:1.65}
.verdict .t b{display:block; color:var(--ink); font-size:1rem}
.v-o{color:var(--good)} .v-t{color:var(--mid)} .v-x{color:var(--weak)}

/* ---- stack (mode B) ---- */
.slots{display:flex; flex-direction:column; gap:12px}
.slot{border:1px solid var(--line-soft); background:var(--surface); border-radius:12px; padding:15px; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:9px}
.slot .top{display:flex; align-items:baseline; gap:10px}
.slot .step{font-family:var(--mono); font-size:.75rem; font-weight:600; color:var(--accent); background:var(--accent-soft); padding:2px 7px; border-radius:5px; flex:none}
.slot .nm{font-weight:700; font-size:.99rem}
.slot .hint{font-size:.87rem; color:var(--ink-3); line-height:1.6}
.slot textarea{min-height:64px}
.para{font-family:var(--serif); font-size:1.06rem; line-height:2.05; font-weight:600; background:var(--good-soft); border-radius:12px; padding:18px}

/* ---- reference ---- */
.reflist{display:flex; flex-direction:column; gap:8px}
details.ref{background:var(--surface); border:1px solid var(--line-soft); border-radius:11px; box-shadow:var(--shadow); overflow:hidden}
details.ref summary{padding:14px 16px; cursor:pointer; display:flex; align-items:center; gap:11px; list-style:none; font-weight:700; font-size:1.01rem}
details.ref summary::-webkit-details-marker{display:none}
details.ref summary .no{font-family:var(--mono); font-size:.7rem; color:var(--ink-3); font-weight:400}
details.ref summary .grp{margin-left:auto; font-size:.74rem; font-family:var(--mono); letter-spacing:.06em; color:var(--accent); background:var(--accent-soft); padding:3px 8px; border-radius:999px; font-weight:400}
details.ref .body{padding:0 16px 16px; display:flex; flex-direction:column; gap:11px; border-top:1px solid var(--line-soft); padding-top:13px; margin-top:-1px}
details.ref .body .f{font-size:.92rem; color:var(--ink-2); line-height:1.75}
details.ref .body .ex{font-family:var(--serif); font-size:1rem; font-weight:600; line-height:1.9; padding-left:14px; border-left:2px solid var(--accent)}
details.ref .body .wy{font-size:.89rem; color:var(--ink-3); line-height:1.75}

/* ---- stats ---- */
.statrow{display:grid; grid-template-columns:1fr auto; gap:6px 12px; align-items:center; padding:11px 0; border-bottom:1px solid var(--line-soft)}
.statrow:last-child{border-bottom:0}
.statrow .nm{font-size:.96rem; font-weight:500}
.statrow .ct{font-family:var(--mono); font-size:.81rem; color:var(--ink-3); font-variant-numeric:tabular-nums}
.statrow .track{grid-column:1/3; height:6px; border-radius:999px; background:var(--line-soft); display:flex; overflow:hidden}
.statrow .track i{display:block; height:100%}
.statrow .track .o{background:var(--good)} .statrow .track .t{background:var(--mid)} .statrow .track .x{background:var(--weak)}
.weak-tags{display:flex; gap:7px; flex-wrap:wrap; margin-top:4px}
.weak-tags span{font-size:.85rem; padding:4px 10px; border-radius:999px; background:var(--weak-soft); color:var(--weak); font-weight:500}
.empty{font-size:.92rem; color:var(--ink-3); line-height:1.8}

.note{font-size:.85rem; color:var(--ink-3); line-height:1.75}
.note b{color:var(--ink-2)}
.foot{border-top:1px solid var(--line); padding-top:16px; display:flex; flex-direction:column; gap:10px}

@media (prefers-reduced-motion: reduce){*{transition:none !important; animation:none !important}}
</style>

<div class="wrap">
  <header class="masthead">
    <div class="brand">ミルトン道場<small>MILTON MODEL / OUTPUT PRACTICE</small></div>
    <button class="themebtn" id="theme" type="button">◐ 表示</button>
  </header>
  <main id="app"></main>
</div>

<script>
"use strict";

/* ===================== パターン定義（原典 第6章に準拠） ===================== */
const PATTERNS = [
  { id:"nom", no:"01", name:"名詞化", grp:"逆メタモデル",
    form:"動詞（進行中のプロセス）を名詞に変えて、中身を言わずに置く。",
    ex:"あなたの中の<b>変化</b>が、静かに始まっています。",
    why:"名詞の中身が空っぽだから、相手の脳が自分の記憶から一番ふさわしいものを探して埋める（TDサーチ）。",
    scaffold:"〔相手の状況〕の中に、あなたの〈○○〉が、もう始まっています。<br><span class=\"sk\">〈○○〉に入れる名詞 … 変化／気づき／答え／準備／力／基準</span>",
    checks:["中身を言わずに、名詞（変化・気づき・答え・力…）で置けているか",
            "その名詞を、相手が自分の中身で埋められる余白があるか",
            "曖昧にしすぎて、何の話か分からなくなっていないか"] },
  { id:"ref", no:"02", name:"不特定指示詞", grp:"逆メタモデル",
    form:"「誰が」「何を」を特定しない。人は誰でも／多くの方が／あるもの。",
    ex:"人は誰でも、深い<b>リソース</b>を持っています。",
    why:"特定されていないから否定できず、相手は「自分のこと」として受け取る。",
    scaffold:"人は誰でも、〔誰も否定できない一般則〕ものです。<br><span class=\"sk\">主語を「人は誰でも」「多くの方が」に上げるのがコツ</span>",
    checks:["主語を特定しない形（人は誰でも／多くの方が）になっているか",
            "対象（リソース・もの・場所）も特定せずに置けているか",
            "一般論が浮かず、相手の話とつながって聞こえるか"] },
  { id:"vrb", no:"03", name:"不特定動詞", grp:"逆メタモデル",
    form:"「どうやって」を言わない動詞を使う。導く／進む／整う／始まる／ほどける。",
    ex:"その体験が、あなたを素晴らしい場所へ<b>導きます</b>。",
    why:"手順が空白だから、相手が自分に合ったやり方を無意識で補完する。",
    scaffold:"〔その体験・その感覚〕が、あなたを、〈○○〉いきます。<br><span class=\"sk\">〈○○〉に入れる動詞 … 導いて／進めて／整えて／ほどいて／連れて</span>",
    checks:["やり方を言わない動詞（導く・進む・整う・始まる）を使っているか",
            "具体的な手順や方法を言っていないか",
            "主語を相手の体験や無意識の側に置けているか"] },
  { id:"and", no:"04", name:"ペーシング・接続詞（弱）", grp:"ペーシング",
    form:"〈今この瞬間の否定できない事実〉＋ <b>そして</b> ＋〈誘導したいステイト〉",
    ex:"あなたは私の声を聞いています。<b>そして</b>、ゆっくりリラックスできます。",
    why:"脳がAを真実と認めているので、つながれたBも真実として通る（ヘッブの法則）。",

/* ===================== 記録（この端末の localStorage のみ） ===================== */
const KEY = "milton-drill-v1";
const MAX_RECORDS = 400;
let store = { records: [], timer: 0, fs: 1, level: "normal" };

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){
      const o = JSON.parse(raw);
      if(Array.isArray(o.records)) store.records = o.records.slice(-MAX_RECORDS);
      if(typeof o.timer === "number") store.timer = o.timer;
      if(typeof o.fs === "number" && o.fs > 0.5 && o.fs < 2) store.fs = o.fs;
      if(["intro","normal","real"].includes(o.level)) store.level = o.level;
    }
  }catch(e){ /* 使えない環境でもドリルは動く */ }
}
/* 倍率だけを CSS に渡す。端末別の基準は CSS 側が持つ */
function applyFontSize(){
  document.documentElement.style.setProperty("--fs-scale", store.fs || 1);
}

function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(store)); }catch(e){}
}
/* 保存するのはパターンIDと判定と日付だけ。入力した文章は一切保存しない。 */
function record(pid, verdict){
  store.records.push({ p:pid, r:verdict, d:Date.now() });
  if(store.records.length > MAX_RECORDS) store.records = store.records.slice(-MAX_RECORDS);
  save();
}
function statsFor(pid){
  const rs = store.records.filter(r => r.p === pid);
  return { o:rs.filter(r=>r.r==="o").length, t:rs.filter(r=>r.r==="t").length, x:rs.filter(r=>r.r==="x").length, n:rs.length };
}
function strengthOf(pid){
  const rs = store.records.filter(r => r.p === pid).slice(-6);
  if(!rs.length) return null;
  const pts = rs.reduce((s,r)=> s + (r.r==="o"?2 : r.r==="t"?1 : 0), 0);
  return pts / (rs.length * 2);
}
function weakestIds(count){
  const scored = PATTERNS.map(p => {
    const s = strengthOf(p.id);
    return { id:p.id, key: s === null ? -1 : s };  // 未着手を最優先
  });
  scored.sort((a,b)=> a.key - b.key);
  return scored.slice(0, count).map(s => s.id);
}

/* ===================== レベル ===================== */
const LEVELS = {
  intro:  { name:"入門", hint:"always", shakyo:true,  desc:"型の骨組みを最初から表示。2つチェックで◯。写経も使えます。" },
  normal: { name:"標準", hint:"button", shakyo:true,  desc:"ヒントは押したときだけ。3つチェックで◯。" },
  real:   { name:"実戦", hint:"none",   shakyo:false, desc:"ヒントなし。3つチェックで◯。タイマーと合わせるとセッション本番に近づきます。" }
};
const LV = () => LEVELS[store.level] || LEVELS.normal;

/* チェックの数から判定を出す。入門だけ基準を緩める */
function verdictOf(n){
  if(store.level === "intro") return n >= 2 ? "o" : n >= 1 ? "t" : "x";
  return n === 3 ? "o" : n === 2 ? "t" : "x";
}

let seqPick = "random";   // 連結ドリルで選んだ型（"random" ならその都度ランダム）
let curSeq = null;        // 出題中の型

let recent = [];          // 直近に出した設問（重複回避）
let tick = null, left = 0, total = 0, expired = false, deadline = 0;

const app = document.getElementById("app");
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

/* ===================== 出題 ===================== */
function pickSingle(weakMode){
  let pool = DRILLS;
  if(weakMode){
    const ids = weakestIds(4);
    const sub = DRILLS.filter(d => ids.includes(d.p));
    if(sub.length) pool = sub;
  }
  let fresh = pool.filter(d => !recent.includes(d.p + d.u));
  if(!fresh.length) fresh = pool;
  const d = fresh[Math.floor(Math.random() * fresh.length)];
  recent.push(d.p + d.u); if(recent.length > 8) recent.shift();
  return d;
}
function pickStack(){
  curSeq = seqPick === "random" ? SEQS[Math.floor(Math.random() * SEQS.length)] : SEQ[seqPick];
  const tag = it => "S" + curSeq.id + it.u;
  let fresh = curSeq.items.filter(it => !recent.includes(tag(it)));
  if(!fresh.length) fresh = curSeq.items;
  const it = fresh[Math.floor(Math.random() * fresh.length)];
  recent.push(tag(it)); if(recent.length > 8) recent.shift();
  return it;
}

function start(m, weak){
  mode = m;
  weakMode = !!weak;
  cur = m === "stack" ? pickStack() : pickSingle(weakMode);
  checked = [false,false,false];
  revealed = false; expired = false;
  hintOn = false; shakyoOn = false;
  view = "drill";
  render();
  startTimer();
}
function next(){ start(mode, weakMode); }

/* ===================== タイマー ===================== */
function stopTimer(){ if(tick){ clearInterval(tick); tick = null; } }
function startTimer(){
  stopTimer();
  if(!store.timer || mode === "stack"){ left = 0; total = 0; return; }
  total = store.timer; left = store.timer; expired = false;
  deadline = Date.now() + store.timer * 1000;   // 実時間で計る（画面を伏せてもズレない）
  paintTimer();
  tick = setInterval(() => {
    left = Math.max(0, Math.ceil((deadline - Date.now()) / 1000));
    if(left === 0){ expired = true; stopTimer(); }
    paintTimer();
  }, 250);
}
function paintTimer(){
  const n = document.getElementById("tnum"), b = document.getElementById("tbar"), m = document.getElementById("tmsg");
  if(!n) return;
  n.textContent = String(left).padStart(2,"0");
  n.classList.toggle("low", left <= 5);
  if(b) b.style.width = (total ? (left/total*100) : 0) + "%";
  if(m) m.textContent = expired ? "時間です。今の状態のままで答え合わせへ。" : "";
}

          ${correct.checks.map((c,i) => `
            <button class="chk" type="button" data-chk="${i}" aria-pressed="${checked[i]}">
              <span class="box">✓</span><span>${esc(c)}</span>
            </button>`).join("")}
        </div>
      </div>
      ${metaVerdictHTML()}
      <div class="btnrow">
        <button class="btn" id="nextspot" type="button">${spotIx + 1 >= curMono.spots.length ? "記録して仕上げへ" : "記録して次の一言へ"}</button>
        <button class="btn ghost" data-go="home" type="button">終える</button>
      </div>
    ` : ""}
  </div>`;
}

function metaVerdictHTML(){
  const n = checked.filter(Boolean).length;
  const v = verdictOf(n);
  const glyph = { o:"◯", t:"△", x:"✕" }[v];
  const label = { o:"回復できている", t:"あと一歩", x:"型から外れている" }[v];
  const desc = {
    o:"この質問なら、クライアントの中で情報が戻ります。次へ。",
    t:"外れた項目を見直して、もう一度声に出して言い換えてみてください。",
    x:"模範の質問を3回、声に出して読んでから次へ進んでください。"
  }[v];
  return `<div class="verdict"><span class="g v-${v}">${glyph}</span><span class="t"><b>${label}</b>${desc}</span></div>`;
}

function metaDoneHTML(){
  const used = {};
  curMono.spots.forEach(sp => { used[sp.p] = (used[sp.p] || 0) + 1; });
  return `
  <div style="display:flex;flex-direction:column;gap:16px">
    <div class="stepbar"><span>${esc(curMono.title)} — 通し終わり</span><span class="sp"></span>
      <button class="themebtn" data-go="home" type="button">← 戻る</button></div>
    <div class="card">
      <p class="eyebrow" style="margin:0 0 8px">この語りに入っていたパターン</p>
      ${Object.keys(used).map(id => `<div class="statrow"><span class="nm">${esc(M[id].name)}</span><span class="ct">${used[id]}か所</span></div>`).join("")}
      <p class="note" style="margin:12px 0 0">${curMono.spots.length}か所を通しました。実際のセッションでは、これを<b>会話しながら</b>やることになります。</p>
    </div>
    <div class="mono">${esc(curMono.text)}</div>
    <div class="btnrow">
      <button class="btn" data-go="metapick" type="button">別の語りをやる</button>
      <button class="btn ghost" data-go="home" type="button">ホームへ</button>
    </div>
  </div>`;
}

function metaRefHTML(){

  <div style="display:flex;flex-direction:column;gap:16px">

    <p class="lvnote" style="margin:0">⚠️ 原則として「なぜ」は使いません。責められていると感じさせ、言い訳しか引き出せなくなるためです。「具体的に何が？」「どのようにして？」を使います。</p>

function referenceHTML(){
  return `
  <div style="display:flex;flex-direction:column;gap:16px">
    <div class="stepbar"><span>パターン早見表</span><span class="sp"></span>
      <button class="themebtn" data-go="home" type="button">← 戻る</button></div>
    <p class="muted" style="margin:0">ミルトンモデルは、あえて情報を曖昧にすることで意識の批判的フィルターを迂回し、相手の無意識のリソースへアクセスさせる間接的な影響言語です。</p>

function statsHTML(){
  const total = store.records.length;
  const weak = weakestIds(3).map(id => P[id].name);
  return `
  <div style="display:flex;flex-direction:column;gap:16px">
    <div class="stepbar"><span>記録</span><span class="sp"></span>
      <button class="themebtn" data-go="home" type="button">← 戻る</button></div>

    ${total ? `
      <div class="card">
        <p class="eyebrow" style="margin:0">いま弱いのは</p>
        <div class="weak-tags">${weak.map(w => `<span>${esc(w)}</span>`).join("")}</div>
        <p class="note" style="margin:10px 0 0">直近6回までの判定から算出しています。未着手のパターンが最優先で並びます。</p>
      </div>` : `
      <div class="card"><p class="empty" style="margin:0">まだ記録がありません。ドリルを1問やると、ここにパターン別の結果が積まれていきます。</p></div>`}

    <div class="card">
      <p class="eyebrow" style="margin:0 0 4px">ミルトンモデル ◯ △ ✕</p>
      ${PATTERNS.map(p => {
        const s = statsFor(p.id);
        const w = s.n ? [s.o,s.t,s.x].map(v => v/s.n*100) : [0,0,0];
        return `<div class="statrow">
          <span class="nm">${esc(p.name)}</span>
          <span class="ct">${s.n ? `${s.o}／${s.t}／${s.x}` : "—"}</span>
          <span class="track">
            <i class="o" style="width:${w[0]}%"></i><i class="t" style="width:${w[1]}%"></i><i class="x" style="width:${w[2]}%"></i>
          </span>
        </div>`;
      }).join("")}
    </div>

    ${store.records.some(r => r.p.startsWith("m") && r.p.length === 3) ? `
    <div class="card">
      <p class="eyebrow" style="margin:0 0 4px">メタモデル ◯ △ ✕</p>
      ${META.map(m => {
        const st = statsFor(m.id);
        const w = st.n ? [st.o,st.t,st.x].map(v => v/st.n*100) : [0,0,0];
        return `<div class="statrow">
          <span class="nm">${esc(m.name)}</span>
          <span class="ct">${st.n ? `${st.o}／${st.t}／${st.x}` : "—"}</span>
          <span class="track">
            <i class="o" style="width:${w[0]}%"></i><i class="t" style="width:${w[1]}%"></i><i class="x" style="width:${w[2]}%"></i>
          </span>
        </div>`;
      }).join("")}
    </div>` : ""}

    <div class="foot">
      <p class="note" style="margin:0">この記録はこの端末のブラウザの中だけにあります。書いた文章は保存していません。</p>
      <button class="btn ghost sm" id="reset" type="button" style="align-self:flex-start">記録をリセット</button>
    </div>
  </div>`;
}

/* ===================== イベント ===================== */
function wire(){
  app.querySelectorAll("[data-go]").forEach(el => {
    el.addEventListener("click", () => {
      const g = el.dataset.go;
      stopTimer();
      if(g === "single"){ start("single", false); }
      else if(g === "weak"){ start("single", true); }
      else { view = g; render(); }
    });
  });

  app.querySelectorAll("[data-mono]").forEach(el => {
    el.addEventListener("click", () => { stopTimer(); startMeta(el.dataset.mono); });
  });

  app.querySelectorAll("[data-pick]").forEach(el => {
    el.addEventListener("click", () => { picked = el.dataset.pick; render(); });
  });

  const ns = document.getElementById("nextspot");
  if(ns) ns.addEventListener("click", () => {
    record(curMono.spots[spotIx].p, verdictOf(checked.filter(Boolean).length));
    nextSpot();
  });

  app.querySelectorAll("[data-seq]").forEach(el => {
    el.addEventListener("click", () => { seqPick = el.dataset.seq; start("stack", false); });
  });

  const seg = document.getElementById("segtimer");
  if(seg) seg.querySelectorAll("button").forEach(b => {
    b.addEventListener("click", () => { store.timer = Number(b.dataset.t); save(); render(); });
  });

  const segl = document.getElementById("seglevel");
  if(segl) segl.querySelectorAll("button").forEach(b => {
    b.addEventListener("click", () => { store.level = b.dataset.l; save(); render(); });
  });

  const segf = document.getElementById("segfont");
  if(segf) segf.querySelectorAll("button").forEach(b => {
    b.addEventListener("click", () => { store.fs = Number(b.dataset.f); save(); applyFontSize(); render(); });
  });

  const rv = document.getElementById("reveal");
  if(rv) rv.addEventListener("click", () => { stopTimer(); revealed = true; render(); });

  const hb = document.getElementById("hintbtn");
  if(hb) hb.addEventListener("click", () => { hintOn = true; render(); });

  const sb = document.getElementById("shakyobtn");
  if(sb) sb.addEventListener("click", () => { stopTimer(); shakyoOn = true; render(); });

  app.querySelectorAll("[data-chk]").forEach(b => {
    b.addEventListener("click", () => {
      const i = Number(b.dataset.chk);
      checked[i] = !checked[i];
      render();
    });
  });

  const nx = document.getElementById("nextq");
  if(nx) nx.addEventListener("click", () => {
    if(nx.dataset.noscore){ next(); return; }   // 写経は採点も記録もしない
    const n = checked.filter(Boolean).length;
    const v = verdictOf(n);
    // 連結ドリルは、その型が使った3つのパターンそれぞれに記録を積む
    if(mode === "stack") curSeq.steps.forEach(st => record(st.p, v));
    else record(cur.p, v);
    next();
  });

  const rs = document.getElementById("reset");
  if(rs) rs.addEventListener("click", () => {
    if(confirm("この端末に保存されている練習の記録を、すべて消します。よろしいですか？")){
      store.records = []; save(); render();
    }
  });
}

/* 表示テーマ（ライト / ダーク / 端末に合わせる） */
document.getElementById("theme").addEventListener("click", () => {
  const r = document.documentElement;
  const now = r.getAttribute("data-theme");
  const nextTheme = now === "light" ? "dark" : now === "dark" ? null : "light";
  if(nextTheme) r.setAttribute("data-theme", nextTheme); else r.removeAttribute("data-theme");
});

/* 起動 */
load();
applyFontSize();
render();
</script>
