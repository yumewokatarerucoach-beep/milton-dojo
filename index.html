<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NLP道場</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2B4B8C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="NLP道場">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="icon" href="icon.svg" type="image/svg+xml">

<style>
:root{
  --ground:#EDEFF4; --surface:#FFFFFF; --surface-2:#F5F7FB;
  --line:#D3D9E6; --line-soft:#E4E8F1;
  --ink:#171C2B; --ink-2:#4A5266; --ink-3:#767E92;
  --accent:#2B4B8C; --accent-soft:#E6ECF8; --accent-ink:#1E3567; --on-accent:#FFFFFF;
  --good:#2C6E5D; --good-soft:#DEEDE7;
  --mid:#8F6416;  --mid-soft:#F4EAD4;
  --weak:#9C4234; --weak-soft:#F6E2DE;
  --shadow:0 1px 2px rgba(23,28,43,.05), 0 6px 18px -10px rgba(23,28,43,.18);
  /* 端末に入っている書体だけを使う（外部読み込みなし＝オフラインでも同じ見え方） */
  --serif:"Hiragino Mincho ProN", "HiraMinProN-W3", "Yu Mincho", "YuMincho", "Noto Serif JP", "Noto Serif CJK JP", "Source Han Serif JP", "Source Han Serif", "MS PMincho", serif;
  --sans:"Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", "YuGothic", "Noto Sans JP", "Meiryo", system-ui, sans-serif;
  --mono:ui-monospace, SFMono-Regular, Menlo, Consolas, "Courier New", monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#111420; --surface:#191D2B; --surface-2:#1F2434;
    --line:#2F3648; --line-soft:#262C3C;
    --ink:#E7EAF2; --ink-2:#A9B0C4; --ink-3:#7C8397;
    --accent:#8CA8DE; --accent-soft:#1D2740; --accent-ink:#BACCEE; --on-accent:#111420;
    --good:#6FC0A6; --good-soft:#16302A;
    --mid:#D9AC59;  --mid-soft:#332A16;
    --weak:#DF8C7C; --weak-soft:#33201C;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --ground:#111420; --surface:#191D2B; --surface-2:#1F2434;
  --line:#2F3648; --line-soft:#262C3C;
  --ink:#E7EAF2; --ink-2:#A9B0C4; --ink-3:#7C8397;
  --accent:#8CA8DE; --accent-soft:#1D2740; --accent-ink:#BACCEE; --on-accent:#111420;
  --good:#6FC0A6; --good-soft:#16302A;
  --mid:#D9AC59;  --mid-soft:#332A16;
  --weak:#DF8C7C; --weak-soft:#33201C;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.6);
}

*{box-sizing:border-box}
/* 文字サイズ：基準は端末幅で CSS が決め、--fs-scale（ユーザー設定）を掛ける */
html{font-size:calc(16px * var(--fs-scale, 1))}
@media (max-width:640px){html{font-size:calc(21px * var(--fs-scale, 1))}}   /* スマホは初めから大きめ */
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:var(--sans); font-size:1rem; line-height:1.78;
  -webkit-text-size-adjust:100%; text-size-adjust:100%;
}
.wrap{max-width:660px; margin:0 auto; padding:20px 16px 72px; display:flex; flex-direction:column; gap:20px}
h1,h2,h3{margin:0; text-wrap:balance; font-weight:700}

/* ---- masthead ---- */
.masthead{display:flex; align-items:baseline; justify-content:space-between; gap:12px; padding-bottom:14px; border-bottom:1px solid var(--line)}
.brand{font-family:var(--serif); font-size:1.45rem; letter-spacing:.02em; line-height:1.3}
.brand small{display:block; font-family:var(--mono); font-size:.70rem; letter-spacing:.16em; color:var(--ink-3); font-weight:400; margin-top:2px}
.themebtn{font-family:var(--mono); font-size:.75rem; letter-spacing:.08em; color:var(--ink-3); background:none; border:1px solid var(--line); border-radius:999px; padding:4px 10px; cursor:pointer}
.themebtn:hover{color:var(--ink-2); border-color:var(--ink-3)}

/* ---- generic ---- */
.card{background:var(--surface); border:1px solid var(--line-soft); border-radius:12px; padding:18px; box-shadow:var(--shadow)}
.eyebrow{font-family:var(--mono); font-size:.74rem; letter-spacing:.16em; text-transform:uppercase; color:var(--ink-3)}
.muted{color:var(--ink-2); font-size:.92rem; line-height:1.7}
.hr{height:1px; background:var(--line-soft); border:0; margin:0}

button{font-family:inherit}
.btn{
  display:block; width:100%; padding:14px 18px; border-radius:10px; border:1px solid transparent;
  background:var(--accent); color:var(--on-accent); font-size:1rem; font-weight:700; cursor:pointer; line-height:1.4;
}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent; color:var(--ink-2); border-color:var(--line); font-weight:500}
.btn.ghost:hover{border-color:var(--ink-3); color:var(--ink); filter:none}
.btn.sm{padding:9px 14px; font-size:.91rem; width:auto}
.btnrow{display:flex; gap:10px; flex-wrap:wrap}
.btnrow .btn{flex:1 1 auto; width:auto}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

/* ---- home: mode list ---- */
.modes{display:flex; flex-direction:column; gap:10px}
.mode{
  display:grid; grid-template-columns:auto 1fr; gap:2px 14px; align-items:start;
  width:100%; text-align:left; padding:16px; border-radius:12px; cursor:pointer;
  background:var(--surface); border:1px solid var(--line-soft); box-shadow:var(--shadow); color:inherit;
}
.mode:hover{border-color:var(--accent)}
.mode .mk{grid-row:1/3; font-family:var(--mono); font-size:.79rem; font-weight:600; color:var(--accent);
  background:var(--accent-soft); border-radius:6px; padding:6px 8px; letter-spacing:.06em}
.mode b{font-size:1.02rem; font-weight:700}
.mode span{font-size:.89rem; color:var(--ink-2); line-height:1.65}
.modes .grp{margin:12px 0 -2px}
.mode .meta{white-space:nowrap; color:var(--ink-3)}
.modes .grp:first-child{margin-top:0}

/* ---- timer selector ---- */
.seg{display:flex; gap:0; border:1px solid var(--line); border-radius:9px; overflow:hidden}
.seg button{flex:1; padding:9px 4px; background:var(--surface); border:0; border-right:1px solid var(--line);
  font-family:var(--mono); font-size:.85rem; color:var(--ink-2); cursor:pointer}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent); color:var(--on-accent)}

.setrow{display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap}
.setrow .seg{flex:1 1 220px}

/* ---- drill ---- */
.stepbar{display:flex; align-items:center; gap:10px; font-family:var(--mono); font-size:.74rem; letter-spacing:.1em; color:var(--ink-3)}
.stepbar .dot{width:5px; height:5px; border-radius:50%; background:var(--line)}
.stepbar .dot.on{background:var(--accent)}
.stepbar .sp{flex:1}

.utter{
  background:var(--surface); border:1px solid var(--line-soft); border-left:3px solid var(--accent);
  border-radius:4px 12px 12px 4px; padding:20px 20px 18px; box-shadow:var(--shadow);
}
.utter .who{font-family:var(--mono); font-size:.73rem; letter-spacing:.16em; color:var(--ink-3); margin-bottom:8px}
.utter p{margin:0; font-family:var(--serif); font-size:1.16rem; line-height:1.95; font-weight:600}

.task{background:var(--accent-soft); border-radius:12px; padding:16px 18px; display:flex; flex-direction:column; gap:6px}
.task .lbl{font-family:var(--mono); font-size:.73rem; letter-spacing:.16em; color:var(--accent); text-transform:uppercase}
.task h2{font-size:1.06rem; color:var(--accent-ink)}
.task .form{font-size:.92rem; color:var(--ink-2); line-height:1.7}
.task .form code{font-family:var(--mono); font-size:.82em; background:var(--surface); padding:1px 5px; border-radius:4px}

.speak{display:flex; align-items:center; gap:10px; font-size:.91rem; color:var(--ink-2); padding:0 2px}
.speak .n{font-family:var(--mono); font-size:.7rem; color:var(--accent); border:1px solid var(--accent); border-radius:50%; width:19px; height:19px; display:grid; place-items:center; flex:none}
.hintbox{background:var(--mid-soft); border-radius:11px; padding:14px 16px; display:flex; flex-direction:column; gap:7px}
.hintbox .lbl{font-family:var(--mono); font-size:.74rem; letter-spacing:.14em; text-transform:uppercase; color:var(--mid)}
.hintbox .bd{font-size:.96rem; line-height:1.9}
.hintbox .bd code{font-family:var(--mono); font-size:.86em; background:var(--surface); padding:1px 5px; border-radius:4px}
.hintbox .sk{display:block; margin-top:4px; font-size:.88rem; color:var(--ink-2)}
.shakyo{background:var(--good-soft); border-radius:11px; padding:16px; display:flex; flex-direction:column; gap:11px}
.shakyo .lbl{font-family:var(--mono); font-size:.74rem; letter-spacing:.14em; text-transform:uppercase; color:var(--good)}
.shakyo .say{font-family:var(--serif); font-size:1.06rem; font-weight:600; line-height:1.95}
.shakyo .how{font-size:.9rem; color:var(--ink-2); line-height:1.8}
.mono{background:var(--surface); border:1px solid var(--line-soft); border-radius:12px; padding:18px; box-shadow:var(--shadow);
  font-family:var(--serif); font-size:1.02rem; line-height:2.15; font-weight:600; max-height:44vh; overflow-y:auto}
.mono .who{font-family:var(--mono); font-size:.73rem; letter-spacing:.16em; color:var(--ink-3); font-weight:400; margin-bottom:9px}
.mono .dim{color:var(--ink-3); font-weight:500}
.mono mark.spot{background:var(--mid-soft); color:var(--ink); padding:2px 3px; border-radius:3px;
  box-shadow:0 1px 0 var(--mid), 0 -1px 0 var(--mid)}
.pgrid{display:grid; grid-template-columns:repeat(auto-fill, minmax(150px,1fr)); gap:7px}
.pgrid button{padding:11px 10px; border-radius:9px; border:1px solid var(--line); background:var(--surface); color:var(--ink-2);
  font-family:inherit; font-size:.9rem; line-height:1.45; cursor:pointer; text-align:left}
.pgrid button:hover{border-color:var(--accent); color:var(--ink)}
.pgrid button[aria-pressed="true"]{border-color:var(--accent); background:var(--accent-soft); color:var(--accent-ink); font-weight:700}
.pgrid button .c{display:block; font-family:var(--mono); font-size:.72rem; color:var(--ink-3); letter-spacing:.06em}
.pgrid button[aria-pressed="true"] .c{color:var(--accent)}
.pickres{display:flex; gap:12px; align-items:flex-start; padding:14px 16px; border-radius:11px; border:1px solid var(--line-soft); background:var(--surface)}
.pickres .g{font-size:1.4rem; line-height:1.2; flex:none}
.pickres .t{font-size:.92rem; line-height:1.7; color:var(--ink-2)}
.pickres .t b{display:block; color:var(--ink); font-size:1.02rem}
.progress{display:flex; gap:4px; align-items:center}
.progress i{flex:1; height:4px; border-radius:999px; background:var(--line-soft)}
.progress i.done{background:var(--good)} .progress i.now{background:var(--accent)}
.alsobox{font-size:.9rem; color:var(--ink-2); line-height:1.75; background:var(--surface-2); border-radius:9px; padding:11px 13px}
.alsobox b{color:var(--ink)}
.premise{margin:0; font-size:.88rem; color:var(--ink-3); line-height:1.75; text-align:center; padding:2px 8px}
.premise span{display:block; font-size:.85em; opacity:.8; margin-top:2px}
.termbox{background:var(--surface-2); border-radius:10px; padding:13px 15px; font-size:.9rem; line-height:1.85; color:var(--ink-2)}
.termbox b{color:var(--ink)}
.termbtn{background:none; border:0; padding:0; color:var(--accent); font-family:inherit; font-size:.86rem;
  cursor:pointer; text-decoration:underline; text-underline-offset:3px; align-self:flex-start}
.termbtn:hover{color:var(--accent-ink)}
.lvnote{font-size:.85rem; color:var(--ink-3); line-height:1.7}
.mictip{font-size:.86rem; color:var(--ink-3); line-height:1.75; padding:2px 0 2px 13px; border-left:2px solid var(--line)}
.mictip b{color:var(--ink-2); font-weight:700}

textarea{
  width:100%; min-height:110px; resize:vertical; padding:14px; border-radius:10px;
  border:1px solid var(--line); background:var(--surface); color:var(--ink);
  font-family:var(--sans); font-size:1rem; line-height:1.8;
}
textarea::placeholder{color:var(--ink-3)}

.timer{display:flex; align-items:center; gap:10px; justify-content:space-between}
.timer .num{font-family:var(--mono); font-size:1.5rem; font-weight:600; font-variant-numeric:tabular-nums; color:var(--ink-2)}
.timer .num.low{color:var(--weak)}
.timer .bar{flex:1; height:3px; background:var(--line-soft); border-radius:999px; overflow:hidden}
.timer .bar i{display:block; height:100%; background:var(--accent); transition:width .95s linear}
.timer .msg{font-size:.87rem; color:var(--weak)}

/* ---- review ---- */
.model{background:var(--surface); border:1px solid var(--line-soft); border-radius:12px; padding:18px; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:14px}
.model h3{font-size:.85rem; font-family:var(--mono); letter-spacing:.14em; text-transform:uppercase; color:var(--ink-3); font-weight:400}
.model ul{margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:12px}
.model li{font-family:var(--serif); font-size:1.04rem; line-height:1.9; font-weight:600; padding-left:16px; border-left:2px solid var(--good)}
.model li mark{background:var(--mid-soft); color:var(--ink); padding:0 3px; border-radius:3px; font-weight:700}
.point{font-size:.92rem; color:var(--ink-2); line-height:1.8; background:var(--surface-2); border-radius:9px; padding:12px 14px}
.point b{color:var(--ink); font-weight:700}

.checks{display:flex; flex-direction:column; gap:8px}
.chk{
  display:flex; gap:12px; align-items:flex-start; text-align:left; width:100%;
  padding:13px 15px; border-radius:10px; border:1px solid var(--line); background:var(--surface);
  color:var(--ink-2); font-size:.95rem; line-height:1.7; cursor:pointer;
}
.chk .box{flex:none; width:20px; height:20px; border-radius:5px; border:1.5px solid var(--line); margin-top:2px;
  display:grid; place-items:center; font-size:.79rem; color:transparent}
.chk[aria-pressed="true"]{border-color:var(--good); background:var(--good-soft); color:var(--ink)}
.chk[aria-pressed="true"] .box{background:var(--good); border-color:var(--good); color:var(--surface)}

.verdict{display:flex; align-items:center; gap:14px; padding:16px 18px; border-radius:12px; border:1px solid var(--line-soft); background:var(--surface)}
.verdict .g{font-family:var(--serif); font-size:2rem; line-height:1; font-weight:700; width:44px; text-align:center; flex:none}
.verdict .t{font-size:.93rem; color:var(--ink-2); line-height:1.65}
.verdict .t b{display:block; color:var(--ink); font-size:1rem}
.v-o{color:var(--good)} .v-t{color:var(--mid)} .v-x{color:var(--weak)}

/* ---- stack (mode B) ---- */
.slots{display:flex; flex-direction:column; gap:12px}
.slot{border:1px solid var(--line-soft); background:var(--surface); border-radius:12px; padding:15px; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:9px}
.slot .top{display:flex; align-items:baseline; gap:10px}
.slot .step{font-family:var(--mono); font-size:.75rem; font-weight:600; color:var(--accent); background:var(--accent-soft); padding:2px 7px; border-radius:5px; flex:none}
.slot .nm{font-weight:700; font-size:.99rem}
.slot .hint{font-size:.87rem; color:var(--ink-3); line-height:1.6}
.slot textarea{min-height:64px}
.para{font-family:var(--serif); font-size:1.06rem; line-height:2.05; font-weight:600; background:var(--good-soft); border-radius:12px; padding:18px}

/* ---- reference ---- */
.reflist{display:flex; flex-direction:column; gap:8px}
details.ref{background:var(--surface); border:1px solid var(--line-soft); border-radius:11px; box-shadow:var(--shadow); overflow:hidden}
details.ref summary{padding:14px 16px; cursor:pointer; display:flex; align-items:center; gap:11px; list-style:none; font-weight:700; font-size:1.01rem}
details.ref summary::-webkit-details-marker{display:none}
details.ref summary .no{font-family:var(--mono); font-size:.7rem; color:var(--ink-3); font-weight:400}
details.ref summary .grp{margin-left:auto; font-size:.74rem; font-family:var(--mono); letter-spacing:.06em; color:var(--accent); background:var(--accent-soft); padding:3px 8px; border-radius:999px; font-weight:400}
details.ref .body{padding:0 16px 16px; display:flex; flex-direction:column; gap:11px; border-top:1px solid var(--line-soft); padding-top:13px; margin-top:-1px}
details.ref .body .f{font-size:.92rem; color:var(--ink-2); line-height:1.75}
details.ref .body .ex{font-family:var(--serif); font-size:1rem; font-weight:600; line-height:1.9; padding-left:14px; border-left:2px solid var(--accent)}
details.ref .body .wy{font-size:.89rem; color:var(--ink-3); line-height:1.75}

/* ---- テキスト（読む） ---- */
.tx{display:flex; flex-direction:column; gap:14px}
.tx h2{font-size:1.28rem; margin:0; line-height:1.5}
.tx h3{font-size:1.02rem; margin:10px 0 0; color:var(--ink)}
.tx p{margin:0; font-size:.95rem; line-height:1.9; color:var(--ink-2)}
.tx p b, .tx li b{color:var(--ink)}
.tx ul{margin:0; padding-left:1.25em; display:flex; flex-direction:column; gap:6px}
.tx li{font-size:.95rem; line-height:1.85; color:var(--ink-2)}
.hitokoto{font-family:var(--serif); font-size:1.06rem; font-weight:600; line-height:1.9; padding:15px 17px; background:var(--accent-soft); border-radius:11px; color:var(--ink)}
.kvs{display:flex; flex-direction:column; gap:11px; background:var(--surface); border:1px solid var(--line-soft); border-radius:11px; padding:14px 16px}
.kv{display:flex; flex-direction:column; gap:2px}
.kv .k{font-family:var(--mono); font-size:.72rem; letter-spacing:.08em; color:var(--accent)}
.kv .v{font-size:.94rem; line-height:1.8; color:var(--ink)}
details.pp summary{align-items:flex-start; line-height:1.6}
details.pp summary .no{padding-top:4px}
.linkbtn{background:none; border:0; padding:0; margin-top:4px; color:var(--accent); font:inherit; font-size:.9rem; font-weight:600; text-decoration:underline; text-underline-offset:3px; cursor:pointer; text-align:left}
.srcbox{font-size:.82rem; color:var(--ink-3); line-height:1.8; border-top:1px solid var(--line); padding-top:12px}
.mode .rd{font-family:var(--mono); font-size:.72rem; color:var(--good); margin-left:6px; font-weight:600}

/* ---- stats ---- */
.statrow{display:grid; grid-template-columns:1fr auto; gap:6px 12px; align-items:center; padding:11px 0; border-bottom:1px solid var(--line-soft)}
.statrow:last-child{border-bottom:0}
.statrow .nm{font-size:.96rem; font-weight:500}
.statrow .ct{font-family:var(--mono); font-size:.81rem; color:var(--ink-3); font-variant-numeric:tabular-nums}
.statrow .track{grid-column:1/3; height:6px; border-radius:999px; background:var(--line-soft); display:flex; overflow:hidden}
.statrow .track i{display:block; height:100%}
.statrow .track .o{background:var(--good)} .statrow .track .t{background:var(--mid)} .statrow .track .x{background:var(--line)}
.weak-tags{display:flex; gap:7px; flex-wrap:wrap; margin-top:4px}
.weak-tags span{font-size:.85rem; padding:4px 10px; border-radius:999px; background:var(--weak-soft); color:var(--weak); font-weight:500}
.empty{font-size:.92rem; color:var(--ink-3); line-height:1.8}

.note{font-size:.85rem; color:var(--ink-3); line-height:1.75}
.note b{color:var(--ink-2)}
.foot{border-top:1px solid var(--line); padding-top:16px; display:flex; flex-direction:column; gap:10px}

@media (prefers-reduced-motion: reduce){*{transition:none !important; animation:none !important}}
</style>

<div class="wrap">
  <header class="masthead">
    <div class="brand">NLP道場<small>NLP PRACTICE</small></div>
    <button class="themebtn" id="theme" type="button">◐ 表示</button>
  </header>
  <main id="app"></main>
</div>

<script>
"use strict";

/* ===================== パターン定義（教科書の6グループ順。番号は並び順なので、足すと振り直しになる） ===================== */
const PATTERNS = [
  { id:"del", no:"01", name:"削除", grp:"逆メタモデル",
    form:"「何が」「何を」を言わずに文を置く。〜が見えてきた／〜がわかった／〜が戻ってくる（何が、は言わない）。",
    ex:"話しているうちに、少しずつ<b>はっきりしてきた</b>んじゃないですか。",
    why:"何が、を言わないから、相手は自分にとって一番当てはまるものを、自分の中から探して埋める。",
    scaffold:"〔相手の状況〕のうちに、〈○○〉きたんじゃないですか。<br><span class=\"sk\">〈○○〉に入れる言葉 … はっきりして／見えて／わかって／軽くなって（何が、は言わない）</span>",

const KEY = "milton-drill-v1";
const MAX_RECORDS = 400;
let store = { records: [], timer: 0, fs: 1, level: "normal", read: [], notes: [] };

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){
      const o = JSON.parse(raw);
      if(Array.isArray(o.records)) store.records = o.records.slice(-MAX_RECORDS);
      if(typeof o.timer === "number") store.timer = o.timer;
      if(typeof o.fs === "number" && o.fs > 0.5 && o.fs < 2) store.fs = (o.fs === 1.28 ? 1.33 : o.fs === 0.9 ? 0.88 : o.fs === 1.13 ? 1.15 : o.fs);
      if(["intro","normal","real"].includes(o.level)) store.level = o.level;
      if(Array.isArray(o.read)) store.read = o.read.filter(x => typeof x === "string");
      if(Array.isArray(o.notes)) store.notes = o.notes.slice(0, MAX_NOTES);
    }
  }catch(e){ /* 使えない環境でもドリルは動く */ }
}
/* 倍率だけを CSS に渡す。端末別の基準は CSS 側が持つ */
function applyFontSize(){
  document.documentElement.style.setProperty("--fs-scale", store.fs || 1);
}

function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(store)); }catch(e){}
}
/* 保存するのはパターンIDと判定と日付だけ。入力した文章は一切保存しない。 */
function record(pid, verdict){
  store.records.push({ p:pid, r:verdict, d:Date.now() });
  if(store.records.length > MAX_RECORDS) store.records = store.records.slice(-MAX_RECORDS);
  save();
}
function statsFor(pid){
  const rs = store.records.filter(r => r.p === pid);
  return { o:rs.filter(r=>r.r==="o").length, t:rs.filter(r=>r.r==="t").length, x:rs.filter(r=>r.r==="x").length, n:rs.length };
}
function strengthOf(pid){
  const rs = store.records.filter(r => r.p === pid).slice(-6);
  if(!rs.length) return null;
  const pts = rs.reduce((s,r)=> s + (r.r==="o"?2 : r.r==="t"?1 : 0), 0);
  return pts / (rs.length * 2);
}
function weakestIds(count){
  const scored = PATTERNS.map(p => {
    const s = strengthOf(p.id);
    return { id:p.id, key: s === null ? -1 : s };  // 未着手を最優先
  });
  scored.sort((a,b)=> a.key - b.key);
  return scored.slice(0, count).map(s => s.id);
}

  normal: { name:"標準", hint:"button", shakyo:true,  desc:"ヒントは押したときだけ。3つチェックで◯。" },
  real:   { name:"実戦", hint:"none",   shakyo:false, desc:"ヒントなし。3つチェックで◯。タイマーと合わせるとセッション本番に近づきます。" }
};
const LV = () => LEVELS[store.level] || LEVELS.normal;

/* ここは「採点」ではなく「フィードバック」。うまくいかない出し方は返さない。
   NLPの前提08「フィードバック vs. 失敗」に合わせている。 */
function feedbackOf(n){
  const lv = store.level || "normal";
  let key;
  if(lv === "real")      key = n >= 3 ? "ex" : n >= 2 ? "good" : n >= 1 ? "some" : "start";
  else if(lv === "intro")key = n >= 2 ? "ex" : n >= 1 ? "good" : "start";
  else                   key = n >= 3 ? "ex" : n >= 1 ? "good" : "start";
  return FB[key];
}
const FB = {
  ex:    { key:"ex",    bucket:"o", glyph:"◎", cls:"v-o",
           label:"しっかり入っている", desc:"この感覚を覚えておいてください。次へ。" },
  good:  { key:"good",  bucket:"o", glyph:"○", cls:"v-o",
           label:"型は入っている", desc:"通じます。もう一つ足すと、さらに効きます。" },
  some:  { key:"some",  bucket:"t", glyph:"△", cls:"v-t",
           label:"使えている", desc:"方向は合っています。外れた項目を一つだけ足してみて。" },
  start: { key:"start", bucket:"t", glyph:"・", cls:"v-t",

/* ===================== 出題 ===================== */
function pickSingle(weakMode){
  let pool = DRILLS;
  if(weakMode){
    const ids = weakestIds(4);
    const sub = DRILLS.filter(d => ids.includes(d.p));
    if(sub.length) pool = sub;
  }
  let fresh = pool.filter(d => !recent.includes(d.p + d.u));
  if(!fresh.length) fresh = pool;
  const d = fresh[Math.floor(Math.random() * fresh.length)];
  recent.push(d.p + d.u); if(recent.length > 8) recent.shift();
  return d;
}
function pickStack(){
  curSeq = seqPick === "random" ? SEQS[Math.floor(Math.random() * SEQS.length)] : SEQ[seqPick];
  const tag = it => "S" + curSeq.id + it.u;
  let fresh = curSeq.items.filter(it => !recent.includes(tag(it)));
  if(!fresh.length) fresh = curSeq.items;
  const it = fresh[Math.floor(Math.random() * fresh.length)];
  recent.push(tag(it)); if(recent.length > 8) recent.shift();
  return it;
}

function start(m, weak){
  mode = m;
  noteSaved = false; noteDraft = null; lastWrite = [];
  weakMode = !!weak;
  cur = m === "stack" ? pickStack() : pickSingle(weakMode);
  checked = [false,false,false];
  revealed = false; expired = false;
  hintOn = false; shakyoOn = false; termOn = false;
  view = "drill";
  render();
  startTimer();
}
function next(){ start(mode, weakMode); }

/* ===================== タイマー ===================== */
function stopTimer(){ if(tick){ clearInterval(tick); tick = null; } }
function startTimer(){
  stopTimer();
  if(!store.timer || mode === "stack"){ left = 0; total = 0; return; }
  total = store.timer; left = store.timer; expired = false;
  deadline = Date.now() + store.timer * 1000;   // 実時間で計る（画面を伏せてもズレない）
  paintTimer();
  tick = setInterval(() => {
    left = Math.max(0, Math.ceil((deadline - Date.now()) / 1000));
    if(left === 0){ expired = true; stopTimer(); }
    paintTimer();
  }, 250);
}
function paintTimer(){
  const n = document.getElementById("tnum"), b = document.getElementById("tbar"), m = document.getElementById("tmsg");
  if(!n) return;
  n.textContent = String(left).padStart(2,"0");
  n.classList.toggle("low", left <= 5);
  if(b) b.style.width = (total ? (left/total*100) : 0) + "%";
  if(m) m.textContent = expired ? "時間です。今の状態のままで答え合わせへ。" : "";
}

/* 「言葉帳に残す」を押して、直してから保存する。この端末の中だけ。外には一切送らない。 */
const MAX_NOTES = 200;
let lastWrite = [];      // 答え合わせの直前に書いていた文
let noteSaved = false;   // この回をもう保存したか
let noteDraft = null;    // 編集中の下書き（null なら編集欄を閉じている）
let noteEditIx = null;   // 言葉帳の中で編集している行

function grabWrite(ids){
  lastWrite = ids.map(id => {
    const el = document.getElementById(id);
    return el && el.value ? el.value.trim() : "";
  });
}
const plain = v => String(v == null ? "" : v).replace(/<[^>]+>/g, "");

/* いま解いている問題から、見出し・発言・言葉の例を取り出す */
function noteData(){
  if(mode === "reframe" && curRf){
    return { head:"リフレーミング（" + curRf.kind + "）", u:curRf.u, labels:["意味","状況"],
      models:curRf.meaning.map(m => "意味：" + m).concat(curRf.situation.map(m => "状況：" + m)),
      point:curRf.point };
  }
  if(mode === "vak" && curVk){
    return { head:"感覚の言葉（" + VS[curVk.sense].name + "）", u:curVk.u, labels:["同じ感覚で返す","別の感覚へ"],
      models:curVk.back.concat([curVk.over]), point:curVk.point };
  }
  if(mode === "chunk" && curCh){
    return { head:"チャンキング（" + CD[curCh.dir].short + "）", u:curCh.u, labels:["動かす質問","別の方向へ"],
      models:curCh.qs.concat([curCh.alt]), point:curCh.point };
  }
  if(mode === "goal" && curGl){
    return { head:"ゴールを整える", u:curGl.u, labels:GOAL_COND.map(c => c.no + ". " + c.name),
      models:GOAL_COND.map((c,i) => c.no + ". " + c.name + "：" + curGl.qs[i]),
      point:"整った言い方の例：「" + curGl.fixed + "」" };
  }
  if(mode === "meta" && curMono){
    const spot = curMono.spots[spotIx];
    return { head:"メタモデル｜" + curMono.title + "（" + (spotIx+1) + "／" + curMono.spots.length + "）",
      u:(M[spot.p] ? M[spot.p].name : ""), labels:["回復質問"],
      models:spot.models.map(plain), point:plain(spot.point) };
  }
  if(mode === "stack" && cur && curSeq){
    return { head:"連結ドリル｜" + curSeq.name, u:U[cur.u], labels:["3文つないで"],
      models:[plain(cur.a.join(""))], point:plain(cur.point) };
  }
  if(cur && P[cur.p]){
    return { head:"単発ドリル｜" + P[cur.p].name, u:U[cur.u], labels:["返した言葉"],
      models:cur.models.map(plain), point:plain(cur.point) };
  }
  return null;
}
/* 編集欄の初期値：自分が書いた文。書いていなければ空 */
function draftFromWrite(d){
  const parts = (lastWrite || []).map((m,i) => {
    if(!m) return "";
    const lb = d.labels && d.labels[i] && (lastWrite.length > 1) ? d.labels[i] + "：" : "";
    return lb + m;
  }).filter(Boolean);
  return parts.join("\n");
}
function saveNote(text){
  const d = noteData();
  if(!d) return;
  const body = (text || "").trim();
  if(!body) return;
  store.notes.unshift({ t:Date.now(), head:d.head, u:d.u, text:body, models:d.models, point:d.point });
  if(store.notes.length > MAX_NOTES) store.notes = store.notes.slice(0, MAX_NOTES);
  noteSaved = true; noteDraft = body;
  save(); render();
}

function noteStamp(t){
  const dt = new Date(t);
  return dt.getFullYear() + "/" + (dt.getMonth()+1) + "/" + dt.getDate() + " " + String(dt.getHours()).padStart(2,"0") + ":" + String(dt.getMinutes()).padStart(2,"0");
}
function noteText(n){
  return [noteStamp(n.t) + "  " + n.head, "クライアント役：「" + n.u + "」", n.text].join("\n");
}
function fallbackCopy(text, done, msg){
  try{
    const ta = document.createElement("textarea");
    ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select(); document.execCommand("copy");
    document.body.removeChild(ta); done();
  }catch(e){ if(msg) msg.textContent = "この端末ではコピーができませんでした。文字を長押しして選んでコピーしてください。"; }
}

        <button class="btn ghost" data-go="home" type="button">終了</button>

function metaVerdictHTML(){
  const n = checked.filter(Boolean).length;
  const fb = feedbackOf(n);
  const label = { ex:"しっかり回復できている", good:"回復できている", some:"回復に向かっている", start:"まず、問いを立てた" }[fb.key];
  const desc = {
    ex:"この質問なら、クライアントの中で情報が戻ります。次へ。",
    good:"通じる質問です。もう一つ足すと、さらに深く戻せます。",
    some:"方向は合っています。外れた項目を一つだけ足してみて。",
    start:"問いを立てようとしたこと自体が前進です。模範の質問を一度、声に出してみてください。"
  }[fb.key];
  return `<div class="verdict"><span class="g ${fb.cls}">${fb.glyph}</span><span class="t"><b>${label}</b>${desc}</span></div>
    ${fb.key === "start" ? `<p class="premise">うまくいかなかった結果も、次へのヒント（フィードバック）です。<span>— NLPの前提より</span></p>` : ""}`;
}

<div class="kv"><span class="k">ひとことで</span><span class="v">望んだ結果でも、そうでなくても、結果は「そのやり方をしたら、こうなった」ということです。うまくいかなかったときは、それを次のやり方を決めるヒント（フィードバック）にします。</span></div>

<div class="kv"><span class="k">コーチングの場面で</span><span class="v">うまくいかなかった話を聞いたら、責めるのではなく、「次にどうするか」を決める材料として一緒に見ます。</span></div>
<div class="kv"><span class="k">つながり</span><span class="v"><button class="linkbtn" data-text="t2" type="button">2章「TOTEモデル」を読む →</button></span></div>
</div></details>
</div>

<h3>学習の4段階</h3>
<p>前提のすぐ後に来るのが、「何かができるようになるまでの4つの段階」です。自転車に乗れるようになるまでで考えてみましょう。</p>
<div class="kvs">
<div class="kv"><span class="k">1 ─ 無意識的無能</span><span class="v">できないことに、まだ気づいていない（自転車に乗ったことがない）</span></div>
<div class="kv"><span class="k">2 ─ 意識的無能</span><span class="v">できないと分かっている（乗ってみたら転んだ）</span></div>
<div class="kv"><span class="k">3 ─ 意識的有能</span><span class="v">意識すればできる（ハンドルとペダルに集中すれば乗れる）</span></div>
<div class="kv"><span class="k">4 ─ 無意識的有能</span><span class="v">考えなくても自然にできる（友達と話しながらでも乗れる）</span></div>
</div>
<p>ドリルで「まず声に出して言う」をくり返すのは、3から4に進むためです。セッション中に、考えなくても言葉が出てくる状態を目指します。</p>

<h3>おわりに</h3>
<p>このアプリが◯や✕をつけず、ヒント（フィードバック）を返す形になっているのは、前提08の考え方に沿っているからです。うまくいかなかった答えも、次にどう言うかを決める大事なヒントです。</p>

<div class="srcbox">出典：『NLPプラクティショナー』テキスト（米国NLP協会™ NLP創始者認定講座）<br>前提の順番は教科書と同じです。言い方・説明・例は、このアプリで作りました。<br>※このアプリは個人が作った練習用で、講座や協会の公式のものではありません。</div>` },
  { id:"t2", no:"2", title:"TOTEモデル", min:6, body:`<div class="hitokoto">TOTE（トート）モデルは、人が何かをうまくいくまで「確かめる → やってみる → また確かめる」をくり返す流れを、4つの段階で表したものです。</div>

<h3>4つの段階</h3>
<p>TOTEは、4つの段階の英語の頭文字です。まず何かが起きる（<b>入力</b>）ところから始まります。</p>
<div class="kvs">
<div class="kv"><span class="k">T ─ Test（確かめる）</span><span class="v">今の状態が、狙っている結果になっているかを確認します。</span></div>
<div class="kv"><span class="k">O ─ Operate（やってみる）</span><span class="v">なっていなければ、近づけるための調整をします。</span></div>
<div class="kv"><span class="k">T ─ Test（もう一度確かめる）</span><span class="v">調整したあと、狙っている結果になったかを確認します。</span></div>
<div class="kv"><span class="k">E ─ Exit（終わる）</span><span class="v">狙いどおりになったら、このくり返しは完了。次のことに進みます。</span></div>
</div>
<p>狙いどおりにならなければ、「やってみる」と「確かめる」をくり返します。TOTEは、普段<b>意識せずに行っている簡単な行動</b>を、シンプルに表したモデルです。</p>

<h3>例：子どもが初めて自転車に乗る練習</h3>
<div class="kvs">
<div class="kv"><span class="k">入力</span><span class="v">補助輪を外して、「一人で乗れるようになりたい」と練習を始める</span></div>
<div class="kv"><span class="k">確かめる</span><span class="v">こぎ出すと、ふらついてすぐ足をついてしまう</span></div>
<div class="kv"><span class="k">やってみる</span><span class="v">親に後ろを支えてもらい、足元ではなく前を見てこいでみる</span></div>
<div class="kv"><span class="k">もう一度確かめる</span><span class="v">数メートル進めた。でも、まだふらつく → 少しスピードを出してみる → 親が手を離しても進めた</span></div>
<div class="kv"><span class="k">終わる</span><span class="v">一人で乗れた！ 次は「曲がる」「止まる」という新しいTOTEが始まる</span></div>
</div>
<p>うまくいかなかった1回1回が、「次は何を変えるか」を決める材料になっています。最初は一つひとつ意識して調整していますが（<b>意識的有能</b>）、くり返すうちに、意識しなくても自然に乗れるようになります（<b>無意識的有能</b>）。1章の「学習の4段階」と同じ流れです。</p>

<h3>もっと良くするためのTOTE</h3>
<p>TOTEには、広げた形もあります。こちらは「狙い」がはっきりしているのが特徴です。</p>
<div class="kvs">
<div class="kv"><span class="k">むずかしく言うと</span><span class="v">拡張されたTOTEモデル</span></div>
<div class="kv"><span class="k">ひとことで</span><span class="v">「こうなりたい」というゴール（どうなったらOKかの基準）と、今の状態を比べます。その差を見てやり方を決め、やってみて、また比べます。</span></div>
<div class="kv"><span class="k">うまくいかなかったら</span><span class="v">別のやり方を試します。</span></div>
<div class="kv"><span class="k">うまくいったら</span><span class="v">そこで止まらずに「もっとうまくいくには？」と考えて、また試します。</span></div>
</div>
<p>こうしてTOTEを何度も回しながら、より望ましい状態に近づいていきます。</p>

<h3>前提とのつながり</h3>
<p>「確かめる」で返ってくる結果は、失敗の知らせではなく、次に何を試すかを決める材料です。これは1章の前提08「うまくいかなかった結果も、次へのヒントになる」と同じ考え方です。<br><button class="linkbtn" data-text="t1" type="button">1章「NLPの前提」を読み返す →</button></p>

<h3>コーチングの場面で</h3>
<p>「頑張っているのに、うまくいかない」という話を聞いたら、4つの段階のどこで止まっているかを一緒に見てみます。</p>
<ul>
<li><b>狙いがぼんやりしている</b> … 何を確かめればいいのか分からない</li>
<li><b>同じやり方ばかりくり返している</b> … 「やってみる」の中身が変わっていない</li>
<li><b>確かめていない</b> … やりっぱなしで、結果を見ていない</li>
</ul>

<h3>どうやって生まれたか</h3>
<p>1960年に、心理学者のジョージ・A・ミラー、ユージン・ギャランター、カール・H・プリブラムが、著書『Plans and the Structure of Behavior』で示した考え方です。NLPはこれを取り入れました。</p>

<h3>ふり返ってみよう</h3>
<p>声に出して答えても、紙に書いてもかまいません。正解はありません。</p>
<div class="kvs">
<div class="kv"><span class="k">問い 1</span><span class="v">最近「うまくいくまでくり返したこと」を1つ思い出して、4つの段階に分けてみましょう。</span></div>
<div class="kv"><span class="k">問い 2</span><span class="v">今、うまくいっていないことはありますか？ 4つの段階のどこで止まっているでしょう。</span></div>
<div class="kv"><span class="k">問い 3</span><span class="v">うまくいっていることを1つ選んでください。「もっとうまくいくには？」でもう1回回すなら、次に何を試しますか？</span></div>
</div>

<div class="srcbox">出典：『NLPプラクティショナー』テキスト（米国NLP協会™ NLP創始者認定講座）<br>4つの段階・広げた形・生まれた経緯は教科書に沿っています。言い方・例（自転車）・コーチングの場面・ふり返りの問いは、このアプリで作りました。<br>※このアプリは個人が作った練習用で、講座や協会の公式のものではありません。</div>` },
  { id:"t3", no:"3", title:"リフレーミング", min:8, body:`<div class="hitokoto">リフレーミングとは、出来事を囲んでいる<b>枠（フレーム）を変えること</b>。枠が変わると意味づけが変わり、自分の反応も変わります。</div>

<h3>そもそも、意味は後からついている</h3>
<p>人は出来事をそのまま受け取っているのではなく、自分のフィルターを通して意味をつけています。つまり、<b>出来事そのものには、もともと意味がない</b>。意味をつけているのは自分の方だ、ということです。</p>
<p>だから、枠を変えれば意味が変わり、意味が変われば反応も変わります。</p>
<div class="hitokoto">「問題は問題ではない。問題の捉え方が問題なのだ。」</div>

<h3>目的は「前向きに考える」ことではない</h3>
<p>ここが、いちばん間違えやすいところです。リフレーミングの本当の力は、無理にポジティブに考え直すことではなく、<b>選択肢を増やすこと</b>にあります。</p>
<p>創始者バンドラーの言葉として、選択肢が1つしかないと感じるとき人は身動きが取れず、2つならどちらを選ぶかで悩み、<b>3つ以上あって初めて自由がある</b>、という趣旨が紹介されています。</p>
<p>つまりリフレーミングは、相手の捉え方を「正しい捉え方」に直す作業ではありません。今ある1つの見方に、別の見方を<b>足していく</b>作業です。</p>

<h3>2つのリフレーミング</h3>
<p>リフレーミングは、大きく2種類に分けられます。どちらも、1章の前提とつながっています。</p>
<div class="kvs">
<div class="kv"><span class="k">内容／意味のリフレーミング</span><span class="v">その行動や出来事に、<b>他にどんな意味・価値があるか</b>を見つけます。もとになる前提は「どんな行動にも、自分を守ろうとする理由（肯定的な意図）がある」。</span></div>
<div class="kv"><span class="k">状況のリフレーミング</span><span class="v">その行動や特徴が、<b>どんな場面でなら役に立つか</b>を見つけます。もとになる前提は「どんな行動にも、その価値が活きる状況がある」。</span></div>
</div>
<p><button class="linkbtn" data-text="t1" type="button">1章「NLPの前提」の07を読む →</button></p>

<h3>そのまま使える質問フレーズ</h3>
<p>この形で覚えておくと、セッション中に口から出てきます。</p>
<div class="kvs">
<div class="kv"><span class="k">意味を探す</span><span class="v">それにはどのような肯定的な意図がありますか？<br>それには他にどのような意味がありますか？<br>それには他にどのような価値がありますか？</span></div>
<div class="kv"><span class="k">状況を探す</span><span class="v">それはどのような仕事で活かせますか？<br>それは他のどのような状況で役に立ちますか？</span></div>
</div>

<h3>例</h3>
<div class="kvs">
<div class="kv"><span class="k">元の枠</span><span class="v">「私は心配性で、先のことばかり気にしてしまう」</span></div>
<div class="kv"><span class="k">意味を変える</span><span class="v">先に危険に気づける力がある。気にするのは、大事にしたいものがあるから。</span></div>
<div class="kv"><span class="k">状況を変える</span><span class="v">段取りを組む仕事、人の安全を預かる場面、初めての相手との交渉。</span></div>
</div>
<p>大事なのは、どちらか1つに言い換えて終わりにしないこと。<b>見方が3つ以上になって、初めて相手に選ぶ自由が生まれます。</b></p>

<h3>コーチングの場面で</h3>
<ul>
<li><b>否定してから始めない。</b>「そんなことないですよ」は、相手の見方を消す言い方になります。まず受け取ってから、別の見方を足します</li>
<li><b>押しつけない。</b>相手に<b>しっくりくる感じ（一致感）</b>が出るまで続けて、出なければ別の言い方を試します</li>
<li><b>言い換えを1つで止めない。</b>意味でも状況でも、複数出すほど相手の選択肢が増えます</li>
</ul>

<h3>人と組んでやるワーク</h3>
<p>実際の練習は、人と組んでやる形が3つあります。</p>
<ul>
<li>受け入れがたい事実を述べて、他の人がリフレーミングする（3〜4人）</li>
<li>自分の欠点を述べて、他の人がリフレーミングする（3〜4人）</li>
<li>苦手な人・嫌いな人の特徴を書いて紙を交換し、相手の悩みとして話す（2人）</li>
</ul>
<p>どれも、しっくりくるまで続けて交代し、最後に感想をシェアする流れです。</p>

<h3>ドリルで練習する</h3>
<p>この章の練習は、トップの「R リフレーミング」から回せます。短所・出来事・苦手な人の3種類を、意味と状況の両方で言い換える練習です。<br><button class="linkbtn" data-go="reframe" type="button">リフレーミング・ドリルへ →</button></p>

<h3>ふり返ってみよう</h3>
<p>声に出して答えても、紙に書いてもかまいません。正解はありません。</p>
<div class="kvs">
<div class="kv"><span class="k">問い 1</span><span class="v">自分の短所だと思っていることを1つ挙げて、「他にどのような意味がありますか？」に答えてみましょう。</span></div>
<div class="kv"><span class="k">問い 2</span><span class="v">同じ短所について、「それはどのような仕事で活かせますか？」に答えてみましょう。</span></div>
<div class="kv"><span class="k">問い 3</span><span class="v">1と2で出た見方を数えてください。3つ以上になりましたか？ 足りなければ、もう1つ探してみましょう。</span></div>
</div>

<div class="srcbox">出典：『NLPプラクティショナー』テキスト（米国NLP協会™ NLP創始者認定講座）<br>2つのリフレーミング・質問フレーズ・ワークの流れ・「問題は問題ではない。問題の捉え方が問題なのだ。」は教科書に沿っています。言い方・例（心配性）・コーチングの場面・ふり返りの問いは、このアプリで作りました。<br>※このアプリは個人が作った練習用で、講座や協会の公式のものではありません。</div>` },
  { id:"t4", no:"4", title:"よくまとめられたゴール", min:9, body:`<div class="hitokoto">同じ「こうなりたい」でも、<b>言い方の形が整っているかどうか</b>で、進み方が変わります。整えるための条件が<b>5つ</b>あります。</div>

<h3>5つの条件</h3>
<div class="kvs">
<div class="kv"><span class="k">1 ─ 肯定的に述べる</span><span class="v">「〜したくない」ではなく「〜したい」の形にします。否定の言葉は、実際に動く段階では役に立たないからです。否定語を避けるのは、<b>そのイメージが頭に浮かんでしまうから</b>でもあります。</span></div>
<div class="kv"><span class="k">2 ─ 主体的に（本人が保てる範囲で）</span><span class="v">自分の行動や感じ方を動かせるのは自分だけで、他人の行動には責任を持てません。だからゴールは、<b>本人がコントロールできる範囲</b>で決めます。</span></div>
<div class="kv"><span class="k">3 ─ 五感で確かめられる形にする</span><span class="v">少なくとも3つの感覚（見える・聞こえる・体で感じる）を使って、できる限り具体的にします。「達成したかどうか」を、あとから確かめられる状態にするためです。</span></div>
<div class="kv"><span class="k">4 ─ 今の状態の「良いところ」を残す</span><span class="v">どんな行動の裏にも肯定的な意図があります。今の状態から受け取っているもの（<b>二次利得</b>）は、ゴールを達成したあとも残るように作ります。聞き方はシンプルに「今の状態でいいことはなに？」。</span></div>
<div class="kv"><span class="k">5 ─ まわりと調和させる（エコロジー）</span><span class="v">新しい行動が、家族・友人・仕事にどう影響するかを確かめます。本人だけが良くても、まわりとぶつかるゴールは続きません。</span></div>
</div>

<h3>例：形が整っていないゴール</h3>
<div class="kvs">
<div class="kv"><span class="k">元の言い方</span><span class="v">「もう親と喧嘩したくない」</span></div>
<div class="kv"><span class="k">どこが足りない？</span><span class="v">1（否定の形）と 2（相手を変える話になっている）。</span></div>
<div class="kv"><span class="k">整えると</span><span class="v">「親と話すとき、自分は落ち着いた声で最後まで聞ける」。これなら肯定の形で、自分が保てる範囲の話になります。</span></div>
<div class="kv"><span class="k">さらに 3 を足すと</span><span class="v">「どうなったら『できた』と言えますか？ そのとき何が見えて、何が聞こえて、体はどんな感じですか？」</span></div>
</div>

<h3>ゴールを引き出す質問（要点）</h3>
<p>ゴールを引き出す質問は、「望ましい状態を聞く質問」と「現在の状態を聞く質問」の2組あります。ここでは要点を、5つの条件と対応させて並べます。</p>
<div class="kvs">
<div class="kv"><span class="k">望みを具体的にする（条件1・3）</span><span class="v">望んでいるのは具体的に何ですか。いつ・どこで・誰と、ですか。<br>手に入ったことを、いつ・どうやって分かりますか。何が見えて、何が聞こえて、どんな感じがしますか。</span></div>
<div class="kv"><span class="k">自分の範囲か確かめる（条件2）</span><span class="v">そのために、どんなリソースを持っていますか。それは自分で使える範囲のものですか。</span></div>
<div class="kv"><span class="k">今の良さを確かめる（条件4）</span><span class="v">今の状態のままでいることで、良いことは何ですか。</span></div>
<div class="kv"><span class="k">まわりを確かめる（条件5）</span><span class="v">それは、家族や友人、仕事にどんな影響がありますか。手に入ったら、何が変わりますか。</span></div>
<div class="kv"><span class="k">今の状態を聞く</span><span class="v">具体的に何が問題ですか。それが問題だと、どうして分かりますか。いつ・どこで・誰といるときに起きますか。変えることを止めているのは何ですか。</span></div>
<div class="kv"><span class="k">最後に</span><span class="v">そのために、最初にできることは何ですか。</span></div>
</div>
<p class="note" style="margin:0">現在の状態を聞くときの注意がひとつ。<b>話の中身に入り込みすぎず、その人のやり方（ストラテジー）がどうなっているかを見る</b>こと。</p>

<h3>コーチングの場面で</h3>
<ul>
<li><b>条件4を飛ばさない。</b>「今のままでいることの良いところ」を聞かずに進めると、うまくいきかけたところで戻ります</li>
<li><b>条件2で線を引く。</b>相手を変える話は、そのままではゴールになりません。「あなたは何をしますか」に戻します</li>
<li><b>条件3で確かめ方を決める。</b>五感で確かめられないゴールは、達成したかどうかが分かりません</li>
<li><b>2章とつながります。</b>TOTEの「たしかめる」で使う基準が、ここで作るゴールです<br><button class="linkbtn" data-text="t2" type="button">2章「TOTEモデル」を読む →</button></li>
</ul>

<h3>ドリルで練習する</h3>
<p>この章の練習は、トップの「G ゴールを整える」から回せます。クライアントの一言に対して、5つの条件それぞれを埋める質問を1つずつ作る練習です。<br><button class="linkbtn" data-go="goal" type="button">ゴールのドリルへ →</button></p>

<h3>ふり返ってみよう</h3>
<div class="kvs">
<div class="kv"><span class="k">問い 1</span><span class="v">自分が今いちばん叶えたいことを、声に出して言ってみましょう。5つの条件のうち、足りていないのはどれですか。</span></div>
<div class="kv"><span class="k">問い 2</span><span class="v">「今のままでいることの良いところ」は何ですか。それは、叶えたあとも残りますか。</span></div>
<div class="kv"><span class="k">問い 3</span><span class="v">そのために、今日できる最初の一歩は何ですか。</span></div>
</div>

<div class="srcbox">出典：『NLPプラクティショナー』テキスト（米国NLP協会™ NLP創始者認定講座）<br>5つの条件と、質問の要点は教科書に沿っています。質問リストの全文は載せていません（要点だけをこのアプリの言葉に直しました）。例・コーチングの場面・ふり返りの問いは、このアプリで作りました。<br>※このアプリは個人が作った練習用で、講座や協会の公式のものではありません。</div>` },
  { id:"t5", no:"5", title:"ラポール", min:8, body:`<div class="hitokoto">ラポールとは、<b>信義・好意・理解のある雰囲気、心地よいつながり</b>のこと。「信頼関係」と訳されることも多いですが、もう少し広く、その場の空気そのものだと考えてください。</div>

<h3>言葉の意味</h3>
<p>ラポール（rapport）は、もとはフランス語で「関係」「つながり」「交流」を指す言葉です。</p>
<p>そしてNLPでは、ここを<b>技術として扱います</b>。相性や人柄の問題にせず、観察して、合わせて、確かめる。だから練習で伸ばせます。</p>

<h3>3つの言葉：マッチング → ペーシング → リーディング</h3>
<div class="kvs">
<div class="kv"><span class="k">マッチング</span><span class="v">自分の動きや話し方を、相手の同じ要素に近づけて<b>そろえる</b>こと。ラポールの基本です。</span></div>
<div class="kv"><span class="k">ペーシング</span><span class="v">そろえ続けること。相手が動けば自分も動く。止まった一瞬ではなく、<b>ずっと合わせ続ける</b>のがペーシングです。</span></div>
<div class="kv"><span class="k">リーディング</span><span class="v">合ったうえで、相手を望ましい方向へ<b>連れていく</b>こと。</span></div>
</div>
<div class="hitokoto">ラポールがとれていなければ、リーディングはできません。</div>
<p>順番が逆になると、どんなに良い提案でも入りません。うまくいかないとき、多くは中身ではなく<b>この順番</b>の問題です。</p>

<h3>何を合わせるのか（11の要素）</h3>
<p>合わせる相手は「気持ち」ではなく、目と耳で確かめられるものです。</p>
<div class="kvs">
<div class="kv"><span class="k">1 全身</span><span class="v">相手の姿勢の変化に、自分の姿勢を近づける。</span></div>
<div class="kv"><span class="k">2 体の一部</span><span class="v">瞬きなど、体の動きや癖に合わせる。</span></div>
<div class="kv"><span class="k">3 半身</span><span class="v">相手の上半身、または下半身の一部に合わせる。</span></div>
<div class="kv"><span class="k">4 頭と肩</span><span class="v">頭や肩の角度、そのときの姿勢に合わせる。</span></div>
<div class="kv"><span class="k">5 声の質</span><span class="v">調子・テンポ・大きさ・声色・抑揚の変化に合わせる。</span></div>
<div class="kv"><span class="k">6 言葉</span><span class="v">相手が使っている感覚の言葉に合わせる。<b>同じ言葉を使う</b>のが基本です。</span></div>
<div class="kv"><span class="k">7 顔の表情</span><span class="v">唇をすぼめる、眉を上げるなど、相手の顔の使い方を観察して合わせる。</span></div>
<div class="kv"><span class="k">8 ジェスチャー</span><span class="v"><b>敬意をもって、自然に</b>身振りに合わせる。真似だと気づかれる合わせ方はしません。</span></div>
<div class="kv"><span class="k">9 くり返される言い回し</span><span class="v">相手が何度も使う言葉をそのまま返す（バックトラック）。</span></div>
<div class="kv"><span class="k">10 呼吸</span><span class="v">相手の呼吸に、自分の呼吸を合わせる。いちばん深く効く要素です。</span></div>
<div class="kv"><span class="k">11 間接的に合わせる</span><span class="v">別の形で合わせる方法（クロスオーバー・ミラーリング）。例：相手の呼吸に、自分の声のテンポを合わせる。相手の瞬きに、自分のうなずきを合わせる。</span></div>
</div>

<h3>合ったかどうかは、どう分かるか</h3>
<p>確かめ方はシンプルです。<b>こちらが先に少しだけ変えてみて、相手がついてくるか</b>を見ます。呼吸を少し遅くしてみる。声を少し落としてみる。相手も一緒に変われば、ラポールは取れています。ついてこなければ、まだ合わせる時間が要る、ということです。</p>

<h3>コーチングの場面で</h3>
<ul>
<li><b>ネガティブな話をしてもらうのはOK。</b>ただし、<b>こちらまで一緒に落ち込まない</b>。同調しすぎず、少し引いた位置から見ている状態を保ちます</li>
<li><b>バックトラックは、要約より効く。</b>「つまり◯◯ということですね」とまとめ直すより、相手が使った言葉をそのまま返すほうが、伝わったと感じてもらえます</li>
<li><b>合わせる → 確かめる → 連れていく。</b>提案が入らないときは、提案の中身を変える前に、合わせる時間を増やします</li>
<li><b>2章のTOTEと同じ形</b>です。合わせて、確かめて、まだなら別の要素で合わせ直す<br><button class="linkbtn" data-text="t2" type="button">2章「TOTEモデル」を読む →</button></li>
</ul>

<h3>人と組んでやるワーク</h3>
<p>ラポールは相手がいないと練習できません。2人1組でやる形が3つあります。</p>
<ul>
<li><b>呼吸を合わせる</b> … 一人は普段どおりに呼吸し、もう一人がその呼吸に合わせる。終わったら交代して、感想を伝え合う</li>
<li><b>バックトラック</b> … 一人が1分間、楽しい出来事を話す。聞き役は<b>何も反応せずに</b>聞く（うなずきも相づちもなし）。そのあと同じ話をもう1分、今度は気になった言葉をそのまま返しながら聞く。話し手の感じ方の違いを確かめる</li>
<li><b>リーディングに挑戦</b> … 呼吸を合わせ、合ってきたら、こちらが少しずつペースを変えてみる。相手がついてくるかを見る</li>
</ul>

<h3>ふり返ってみよう</h3>
<div class="kvs">
<div class="kv"><span class="k">問い 1</span><span class="v">最近「話しやすかった人」を思い出してください。その人は、あなたの何に合わせていたと思いますか。11の要素のどれですか。</span></div>
<div class="kv"><span class="k">問い 2</span><span class="v">逆に「話しにくかった場面」では、どの要素がずれていましたか。</span></div>
<div class="kv"><span class="k">問い 3</span><span class="v">次のセッションや会話で、1つだけ意識して合わせるとしたら、どれにしますか。</span></div>
</div>

<div class="srcbox">出典：『NLPプラクティショナー』テキスト（米国NLP協会™ NLP創始者認定講座）<br>ラポールの意味、マッチング・ペーシング・リーディング、合わせる11の要素、ワークの流れは教科書に沿っています。言い方・コーチングの場面・ふり返りの問いは、このアプリで作りました。<br>※このアプリは個人が作った練習用で、講座や協会の公式のものではありません。</div>` },
  { id:"t6", no:"6", title:"キャリブレーション", min:7, body:`<div class="hitokoto">キャリブレーションとは、NLPでいう<b>観察</b>のこと。相手の状態そのものより、<b>状態が変わった瞬間の「違い」を測る</b>ことを指します。</div>

<h3>「読む」のではなく「測る」</h3>
<p>Calibrate（キャリブレート）は、もともと測る・目盛りを合わせるという意味の言葉です。観察の対象は、自分・相手、そして<b>その内側と外側のすべて</b>。</p>
<p>見るのは、次のようなものです。</p>
<div class="kvs">
<div class="kv"><span class="k">表情</span><span class="v">眉、口もと、まばたきの回数、顔色。</span></div>
<div class="kv"><span class="k">態度・姿勢</span><span class="v">肩の力、体の向き、座り方の変化。</span></div>
<div class="kv"><span class="k">声のトーン</span><span class="v">高さ、速さ、間の取り方。</span></div>
<div class="kv"><span class="k">声の大きさ</span><span class="v">同じ話題でも、急に小さくなる瞬間があります。</span></div>
</div>

<h3>大事なのは「その人の中の差」</h3>
<p>腕を組んだ＝拒否、目をそらした＝嘘。こういう決まった読み方は使いません。<b>腕の組み方に意味があるのではなく、さっきまで組んでいなかった人が組んだ、という変化に意味がある</b>からです。</p>
<p>だから順番はこうなります。</p>
<div class="kvs">
<div class="kv"><span class="k">1</span><span class="v">まず、ふだんの状態を見ておく（基準をとる）。</span></div>
<div class="kv"><span class="k">2</span><span class="v">話題が動いたときの変化を見る。</span></div>
<div class="kv"><span class="k">3</span><span class="v">同じ変化がくり返し出るかを確かめる。</span></div>
</div>
<p>意味を当てにいかなくてかまいません。「いま、何かが変わった」と気づければ、そこを聞けばいいからです。</p>

<h3>決めつけない</h3>
<p>観察は、当てっこではありません。視線の動きを読むときの原則は、<b>一部だけを見て決めつけず、総合的に観察しながら、反応の違いに意識を向けること</b>。キャリブレーションも同じです。</p>
<p>自分の読みが当たっているかどうかは、相手に聞けば分かります。「いま、少し止まりましたね。何が浮かびましたか？」と。</p>

<h3>コーチングの場面で</h3>
<ul>
<li><b>言葉より先に、変化が出る。</b>「大丈夫です」と言いながら声が小さくなったら、そこが入り口です</li>
<li><b>変化に気づいたら、決めつけずに聞く。</b>「何か浮かびましたか？」で十分です</li>
<li><b>5章のラポールとセット。</b>合わせるためには、まず相手の今が見えていないといけません<br><button class="linkbtn" data-text="t5" type="button">5章「ラポール」を読む →</button></li>
<li><b>ミルトンモデルのマインド・リーディングとの違い</b>に注意。相手の中身を当てにいくと事故ります。観察するのは<b>状態の変化</b>で、中身は本人に語ってもらいます</li>
</ul>

<h3>人と組んでやるワーク</h3>
<p>観察は相手がいないと練習できません。練習の形は3つ、どれも「違いを当てる」やり方です。</p>
<ul>
<li><b>変化を捉える①</b>（3人以上）… 一人が前に立ってポーズを決める。他の人がよく見てから目を閉じる。その間に1〜2か所ポーズを変え、どこが変わったかを当てる</li>
<li><b>変化を捉える②</b>（2人）… 相手に「好きな人」「苦手な人」を順に思い浮かべてもらう。そのあと、どちらかを思い浮かべてもらい、どちらかを当てる</li>
<li><b>変化を捉える③</b>（2人）… 相手が「良かったこと」「悪かったこと」の短い話を5つ用意し、無言で順に思い出す。こちらは観察して、＋か−かを書き留め、最後に答え合わせ</li>
</ul>
<p>どれも交代して、最後に感想を伝え合います。</p>

<h3>ふり返ってみよう</h3>
<div class="kvs">
<div class="kv"><span class="k">問い 1</span><span class="v">身近な一人を思い浮かべてください。その人の「機嫌がいいとき」と「疲れているとき」の違いは、どこに出ますか。</span></div>
<div class="kv"><span class="k">問い 2</span><span class="v">最近の会話で「何かが変わった」と感じた瞬間はありましたか。何を見て、そう思いましたか。</span></div>
<div class="kv"><span class="k">問い 3</span><span class="v">次の会話で、観察する要素を1つだけ決めるとしたら、どれにしますか（表情／姿勢／声のトーン／声の大きさ）。</span></div>
</div>

<div class="srcbox">出典：『NLPプラクティショナー』テキスト（米国NLP協会™ NLP創始者認定講座）<br>キャリブレーションの定義（観察・測る／対象は自己と他者の内外すべて）、観察する要素（表情・態度・声のトーン・大きさ）、ワーク3つの流れは教科書に沿っています。「決めつけない」は視線解析の項の記述です。言い方・コーチングの場面・ふり返りの問いは、このアプリで作りました。<br>※このアプリは個人が作った練習用で、講座や協会の公式のものではありません。</div>` },
  { id:"t7", no:"7", title:"表象システム", min:10, body:`<div class="hitokoto">人は、見る・聞く・感じる・嗅ぐ・味わうの<b>五感</b>で世界を受け取り、その感覚のまま頭の中にしまっています。この仕組みを<b>表象システム</b>と呼びます。</div>

<h3>五感（VAKOG）</h3>
<div class="kvs">
<div class="kv"><span class="k">V ─ Visual（視覚）</span><span class="v">見る</span></div>
<div class="kv"><span class="k">A ─ Auditory（聴覚）</span><span class="v">聞く・話す</span></div>
<div class="kv"><span class="k">K ─ Kinesthetic（身体感覚）</span><span class="v">感じる・動く</span></div>
<div class="kv"><span class="k">O ─ Olfactory（嗅覚）</span><span class="v">嗅ぐ</span></div>
<div class="kv"><span class="k">G ─ Gustatory（味覚）</span><span class="v">味わう</span></div>
</div>
<p>五感で直接受け取る体験を<b>一次体験</b>といいます。受け取った情報は、そのままではなく、<b>削除・歪曲・一般化</b>というフィルターを通って意識に上がります。フィルターがなければ、人は情報の洪水に飲み込まれてしまうからです。</p>
<p>だから、頭の中にあるのは現実そのものではなく、<b>現実の地図</b>です。1章の前提05「地図は領土ではない」は、ここにつながっています。<br><button class="linkbtn" data-text="t1" type="button">1章「NLPの前提」を読み返す →</button></p>

<h3>言葉に、感覚が出る</h3>
<p>人は、頭の中の感覚をそのまま言葉にしています。だから<b>話し言葉を聞けば、いまどの感覚を使っているか</b>が分かります。</p>
<div class="kvs">
<div class="kv"><span class="k">見る（V）</span><span class="v">見える、見通し、明るい、ぼやけた、描く、先が見えない、パッと</span></div>
<div class="kv"><span class="k">聞く（A）</span><span class="v">聞こえる、言う、声、静か、耳に残る、うるさい、ガヤガヤ</span></div>
<div class="kv"><span class="k">感じる（K）</span><span class="v">感じる、重い、温かい、つかむ、しっくりくる、胸がざわつく、ふわっと</span></div>
<div class="kv"><span class="k">嗅ぐ・味わう（O・G）</span><span class="v">におう、香る、甘い、苦い、後味が悪い</span></div>
<div class="kv"><span class="k">どれでもない言葉</span><span class="v">素晴らしい、幸せ、準備する、理解する。人によって、思い浮かべる感覚が違う言葉です。</span></div>
</div>
<p class="note" style="margin:0">「響く」「ピンとくる」のように、音とも体の感じとも取れる言葉もあります。1語で決めずに、<b>同じ感覚の言葉がくり返し出てくるか</b>で聞き分けます。</p>

<h3>優先表象システム</h3>
<p>人は五感をすべて使っていますが、多くの人には<b>自分にとって価値の高い感覚</b>があります。これを<b>優先表象システム</b>と呼びます。傾向はこう表れます。</p>
<div class="kvs">
<div class="kv"><span class="k">視覚が優位（V）</span><span class="v">描写が細かい／話すのが速い／見た目やデザインにこだわる／見ないと分からない／見る言葉が多い</span></div>
<div class="kv"><span class="k">聴覚が優位（A）</span><span class="v">筋道立てて話す／話す速さは普通〜やや速い／言葉や音にこだわる／聞いたり読んだりしないと分からない／聞く言葉が多い</span></div>
<div class="kv"><span class="k">身体感覚が優位（K）</span><span class="v">感覚で話す／話すのがゆっくり／雰囲気にこだわる／触れ合いを好む／感じる言葉が多い</span></div>
</div>
<p class="note" style="margin:0">「この人はVタイプ」と決めつけるための分類ではありません。場面によって変わります。<b>いまこの話で、どの感覚を使っているか</b>を聞き取るために使います。</p>

<h3>相手の感覚に合わせる</h3>
<p>相手の優先表象に合わせて話すと、相手は<b>よく聞けて、よく見える</b>ようになります。5章のラポールの「言葉を合わせる」は、ここまで細かくできます。</p>
<div class="kvs">
<div class="kv"><span class="k">相手</span><span class="v">「最近、なんだか先が見えなくて」</span></div>
<div class="kv"><span class="k">ずれた返し</span><span class="v">「その気持ち、重たいですよね」（身体感覚で返している）</span></div>
<div class="kv"><span class="k">合った返し</span><span class="v">「先が見えない。いま、どんな景色が見えていますか？」（視覚で返している）</span></div>
</div>

<h3>オーバーラップとトランスレーション</h3>
<div class="kvs">
<div class="kv"><span class="k">オーバーラップ</span><span class="v">ひとつの感覚から、別の感覚へ<b>移っていく</b>こと。相手の感覚に合わせてから、少しずつ他の感覚へ広げていきます。<br>例：「朝の駅のホームが見えてきます。電車が入ってくる音が聞こえて、足もとに少し風を感じます」（見る → 聞く → 感じる）</span></div>
<div class="kv"><span class="k">トランスレーション</span><span class="v">同じ意味の言葉を、相手の感覚に合わせて<b>言い換える</b>こと。<br>例：「決心がついた」 → 見る：「道がはっきり見えた」／聞く：「迷いの声が静かになった」／感じる：「腹が決まった」</span></div>
</div>
<p>合わせる（ペーシング）→ 他の感覚へ広げる（オーバーラップ）→ 望む方向へ連れていく。これは、ラポールからリーディングへ進むときの、ひとつの道筋です。</p>

<h3>コーチングの場面で</h3>
<ul>
<li><b>最初の3分は、相手の感覚の言葉を拾う。</b>「見える」が多いか、「感じる」が多いか</li>
<li><b>質問も、相手の感覚で聞く。</b>「どう感じますか？」が届かない人には「どう見えますか？」の方が答えやすいことがあります</li>
<li><b>行き詰まったら、別の感覚へ。</b>「頭では分かっているのに動けない」人には、見る・聞くから、身体感覚へ広げていきます</li>
</ul>

<h3>ドリルで練習する</h3>
<p>この章の練習は、トップの「V 感覚の言葉」から回せます。相手の言葉から感覚を聞き分けて、その感覚の言葉で返す練習です。<br><button class="linkbtn" data-go="vak" type="button">感覚の言葉のドリルへ →</button></p>

<h3>人と組んでやるワーク</h3>
<ul>

  { id:"t8", no:"8", title:"視線解析", min:6, body:`<div class="hitokoto">人は何かを思い出したり想像したりするとき、目が動きます。NLPでは、その<b>目の動きの向き</b>を、いまどの感覚を使っているかの<b>観察の目安</b>にします。</div>

<p>この章の表は、<b>相手の心を当てるための表ではありません</b>。6章のキャリブレーションと同じで、<b>その人の中の違いに気づくための目安</b>です。</p>

<h3>視線の向きと感覚</h3>

<h3>どう使うか</h3>

<div class="kv"><span class="k">2 ─ 違いに気づく</span><span class="v">大事な話題になったとき、いつもと違う動きが出たら、そこが入り口です。</span></div>

<h3>コーチングの場面で</h3>

<li><b>質問への答えを待つサインとして使う。</b>目が動いているあいだは、相手の中で検索が起きています。次の質問をかぶせず、待ちます</li>

<li><b>目の動きを観察する</b> … その質問を相手にして、目がどの向きに動くかを見る。当てることより、<b>その人のパターン</b>をつかむことが目的です</li>

<h3>ふり返ってみよう</h3>
<div class="kvs">
<div class="kv"><span class="k">問い 1</span><span class="v">鏡の前で「小学校の教室」を思い出してみてください。目はどちらに動きましたか。</span></div>

<div class="srcbox">出典：『NLPプラクティショナー』テキスト（米国NLP協会™ NLP創始者認定講座）<br>視線の向きと感覚の対応（右利き基準）、利き手や腕組みで逆になる場合があること、一部だけで決めつけないこと、ワークの流れは教科書に沿っています。このアプリでは、目の動きを「観察の目安」として紹介しています。目の動きと感覚の対応は、研究で十分に確かめられているわけではありません。言い方・図・質問の例・コーチングの場面・ふり返りの問いは、このアプリで作りました。<br>※このアプリは個人が作った練習用で、講座や協会の公式のものではありません。</div>` },
  { id:"t9", no:"9", title:"コミュニケーションの要素とステイト", min:8, body:`<div class="hitokoto">人は、言葉だけで伝えているわけではありません。そして、同じ言葉でも、<b>話し手がどんな状態（ステイト）にいるか</b>で、届き方が変わります。</div>

<h3>コミュニケーションの3つの要素</h3>
<div class="kvs">
<div class="kv"><span class="k">言語</span><span class="v">言葉そのもの、話の内容。</span></div>
<div class="kv"><span class="k">非言語</span><span class="v">表情・態度・姿勢・ジェスチャー。</span></div>
<div class="kv"><span class="k">準言語</span><span class="v">声のトーン・話す速さ・抑揚。言葉に乗っている「声の表情」です。</span></div>
</div>
<p>やり取りされた情報は、すべて相手のフィルターを通って受け取られます。だから、どれか1つだけ整えても、伝わり方は決まりません。</p>

<h3>「メラビアンの法則」の正しい扱い方</h3>
<p>よく「言葉は7%、見た目が55%、声が38%」と紹介される数字があります。メラビアンの法則と呼ばれるものです。</p>
<div class="hitokoto">ただし、これは<b>気持ちや態度を伝えるときに、言葉と態度が食い違っている</b>という特別な場面での研究結果です。ふだんの会話すべてに当てはまるわけではありません。</div>
<p>「見た目がすべて」「言葉の中身は大事じゃない」は、言いすぎです。第一印象では見た目も大事ですが、<b>優れた話し手ほど、言葉の力の大きさを知っています</b>。言語・非言語・準言語の<b>ぜんぶを使う</b>のが基本です。</p>

<h3>ステイトとは</h3>
<p>ステイトとは、<b>ある程度続く、特定の心と体の状態</b>のことです。その人の体験から生まれていて、<b>常に変わり続けています</b>。</p>
<p>たとえば、試合前の選手が入場してくるときの顔。大勢の前で話し始める直前の講師。同じ言葉を話していても、その人が<b>その状態にしっかり入っているかどうか</b>で、聞き手の受け取り方はまるで変わります。</p>
<div class="kvs">
<div class="kv"><span class="k">インステイト</span><span class="v">特定のステイトに<b>入る</b>こと。</span></div>
<div class="kv"><span class="k">ブレイクステイト</span><span class="v">いまのステイトを、<b>いったんリセットする</b>こと。立ち上がる、窓の外を見る、まったく別の話をする、など。</span></div>
</div>

<h3>コーチングの場面で</h3>
<ul>
<li><b>まず、自分のステイトから。</b>コーチが焦っていたり疲れていたりすると、それが声や姿勢に出て、相手に伝わります。セッションの前に、自分がどんな状態で入るかを決めます</li>
<li><b>相手のステイトを観察する。</b>言葉ではなく、表情・姿勢・声の変化から見ます<br><button class="linkbtn" data-text="t6" type="button">6章「キャリブレーション」を読む →</button></li>
<li><b>行き詰まったら、ブレイクステイト。</b>同じ重い空気のまま話し続けず、いったん姿勢や話題を変えてから戻ります</li>
<li><b>言葉と態度をそろえる。</b>「大丈夫ですよ」と言うなら、声も表情も「大丈夫」の状態で。食い違うと、相手は態度の方を信じます</li>
</ul>

<h3>人と組んでやるワーク</h3>
<ul>
<li><b>ステイトを当てる</b>（3〜4人）… 一人が言葉を使わずに、喜び・わくわく・悲しみ・怒り・イライラなどの状態に入る。他の人は、それがどの状態かを当てる。交代して、最後に感想を伝え合う</li>
</ul>

<h3>ふり返ってみよう</h3>
<div class="kvs">
<div class="kv"><span class="k">問い 1</span><span class="v">あなたが「いちばん調子がいい」ときの状態を思い出してください。そのとき、姿勢・呼吸・声はどうなっていますか。</span></div>
<div class="kv"><span class="k">問い 2</span><span class="v">言葉と態度が食い違っている人に会ったとき、あなたはどちらを信じましたか。</span></div>
<div class="kv"><span class="k">問い 3</span><span class="v">あなたがよく使う「ブレイクステイト」の方法は何ですか。まだないなら、1つ決めてみましょう。</span></div>
</div>

<div class="srcbox">出典：『NLPプラクティショナー』テキスト（米国NLP協会™ NLP創始者認定講座）<br>コミュニケーションの3つの要素、メラビアンの法則の紹介と「特殊な状況での研究結果で、日常すべてには当てはまらない」という扱い、ステイトの定義、インステイト／ブレイクステイト、ワークの流れは教科書に沿っています。例・コーチングの場面・ふり返りの問いは、このアプリで作りました。<br>※このアプリは個人が作った練習用で、講座や協会の公式のものではありません。</div>` },
  { id:"t10", no:"10", title:"チャンキング", min:9, body:`<div class="hitokoto">同じ話でも、扱う<b>かたまりの大きさ</b>を変えると、見え方が変わります。大きさを動かすのが、チャンキングです。</div>

<h3>チャンキングとは</h3>
<p>チャンキングとは、物事を<b>ある順序で区分けする・まとめる・並べる</b>ことです。ある出来事を受け取るとき、情報として扱うサイズは、人によって違います。</p>
<p>たとえば、ペットの話です。</p>
<div class="kvs">
<div class="kv"><span class="k">チャンク大</span><span class="v">ペット</span></div>
<div class="kv"><span class="k">チャンク中</span><span class="v">犬　／　猫　／　うさぎ</span></div>
<div class="kv"><span class="k">チャンク小</span><span class="v">柴犬　／　トイプードル　／　チワワ　<span style="color:var(--ink-3)">（「犬」をさらに小さくしたもの）</span></span></div>
</div>
<p class="note" style="margin:0 0 14px">上下に動くのが<b>大きさ</b>の変化。<b>同じ段の中で横に並んでいるもの</b>（犬・猫・うさぎ）が、横に広げた形です。</p>
<p>「どんなペットを飼いたい？」と聞かれて「ペットならなんでも」と答えるのと、「柴犬がいい」と答えるのとでは、相手の動き方がまるで違います。<b>扱う大きさが変われば、相手の頭に浮かぶものが変わり、返ってくる反応も変わります</b>。これは1章の前提05「地図は領土ではない」につながる話です。<br><button class="linkbtn" data-text="t1" type="button">1章「NLPの前提」を読み返す →</button></p>

<h3>動かす方向は3つ</h3>
<div class="kvs">
<div class="kv"><span class="k">チャンクアップ</span><span class="v">かたまりを<b>大きくする</b>（一般化する）。全体を見る方向です。柴犬 → 犬 → ペット。</span></div>
<div class="kv"><span class="k">チャンクダウン</span><span class="v">かたまりを<b>小さくする</b>（具体化する）。部分を見る方向です。ペット → 犬 → 柴犬。</span></div>
<div class="kv"><span class="k">水平チャンク</span><span class="v">同じ大きさのまま、<b>横に広げる</b>。例を増やす方向です。犬 → 猫、うさぎ、ハムスター。平行チャンクとも呼びます。</span></div>
</div>

<h3>動かすための質問</h3>
<div class="kvs">
<div class="kv"><span class="k">上げる</span><span class="v">「なんのために？」「それで、何が手に入りますか？」</span></div>
<div class="kv"><span class="k">下げる</span><span class="v">「具体的には、何ですか？」「どの場面でですか？」</span></div>
<div class="kv"><span class="k">横に広げる</span><span class="v">「同じ仲間で、ほかには？」「代わりになるものは、ありますか？」</span></div>
</div>

<h3>コーチングの場面で</h3>
<ul>
<li><b>話が大きすぎて動かないときは、下げる。</b>「自信を持ちたい」「ちゃんとしたい」のような大きな言葉は、場面と行動まで下げると、練習できる形になります</li>
<li><b>細かい話に埋もれているときは、上げる。</b>手段や不満が並び始めたら「なんのために？」で目的に戻します</li>
<li><b>選択肢が一つしかないときは、横に広げる。</b>「これしかない」と言う人に、同じ大きさの別の例を並べてもらいます</li>
<li><b>意見がぶつかっているときは、上げる。</b>上げていくと、二人が同じように望んでいたことが見つかることがあります</li>
<li><b>つらい話のときに、いきなり上げない。</b>話が大きくなって、もっと重くなることがあります。まず一つに絞って小さくします</li>
</ul>

<h3>人と組んでやるワーク</h3>
<ul>
<li><b>チャンキングしてみよう</b>（3〜4人）… まず、チャンキングするための質問をみんなで考える。次に、身の回りの物事を一つ選んで、上・下・横に動かしてみる。最後に感想を伝え合う</li>
</ul>

<h3>ふり返ってみよう</h3>
<div class="kvs">
<div class="kv"><span class="k">問い 1</span><span class="v">あなたが人の話を聞くとき、上げるのと下げるのでは、どちらが多いですか。</span></div>
<div class="kv"><span class="k">問い 2</span><span class="v">いま気になっていることを一つ選んで、「なんのために？」と3回くり返してみてください。何が出てきましたか。</span></div>
<div class="kv"><span class="k">問い 3</span><span class="v">同じことを「具体的には？」で3回下げると、今日できることは何になりますか。</span></div>
</div>

<p>この章の練習は、トップの「C チャンキング」から回せます。相手のひとことをどちらへ動かすか見立てて、その質問を作る練習です。<br><button class="linkbtn" data-go="chunk" type="button">チャンキングのドリルへ →</button></p>

<div class="srcbox">出典：『NLPプラクティショナー』テキスト（米国NLP協会™ NLP創始者認定講座）<br>チャンキングの意味、扱うサイズは人それぞれで「地図は領土ではない」につながること、チャンクアップ（一般化・全体的）・チャンクダウン（具体化・部分的）・水平チャンク（並列）の3つ、上げる質問「なんのために？」「何か手に入るのか」、下げる質問「具体的に何か？」、ワークの流れは教科書に沿っています。ペットのたとえ、横に広げる質問の言い方、コーチングの場面、ドリルの発言と質問例、ふり返りの問いは、このアプリで作りました。<br>※このアプリは個人が作った練習用で、講座や協会の公式のものではありません。</div>` },
  { id:"t11", no:"11", title:"サブモダリティ・対照分析", min:9, body:`<div class="hitokoto">同じ「見える」でも、明るいか暗いか、近いか遠いかで、感じ方は変わります。この<b>感覚の細かい違い</b>を扱うのが、サブモダリティです。</div>

<h3>サブモダリティとは</h3>
<p>7章で、人は「見る（V）・聞く（A）・感じる（K）」で世界をとらえていると学びました。この一つひとつの感覚を<b>さらに細かく分けた要素</b>が、サブモダリティです。<br><button class="linkbtn" data-text="t7" type="button">7章「表象システム」を読み返す →</button></p>
<p>たとえば、楽しかった旅行を思い出してください。その場面は明るいですか、暗いですか。近くに見えますか、遠くに見えますか。カラーですか、白黒ですか。こうした<b>「どんなふうに」</b>の部分が、サブモダリティです。</p>
<p>サブモダリティが変わると、<b>同じ出来事への感じ方が変わることがあります</b>。どの要素がどれくらい効くかは、人によって違います。</p>

<h3>2つのタイプ</h3>
<div class="kvs">
<div class="kv"><span class="k">アナログ</span><span class="v">音量つまみや明かりの調光のように、<b>少しずつ</b>変えられるもの。明るさ・大きさ・音量・温度など。速くもゆっくりも変えられます。</span></div>
<div class="kv"><span class="k">デジタル</span><span class="v">オンかオフか、のように<b>切り替わる</b>もの。カラーか白黒か、動画か静止画か、など。</span></div>
</div>
<p>デジタルの中でも大事なのが、この2つです。</p>
<div class="kvs">
<div class="kv"><span class="k">アソシエイト</span><span class="v">その場面に<b>入りこんで、自分の目で見ている</b>状態。感じ方が強く、主観的になります。</span></div>
<div class="kv"><span class="k">ディソシエイト</span><span class="v">その場面から<b>離れて、自分の姿を外から眺めている</b>状態。落ち着いて、客観的に見やすくなります。</span></div>
</div>

<h3>どんな要素があるか</h3>
<div class="kvs">
<div class="kv"><span class="k">見る（V）</span><span class="v">形／大きさ／距離（近い・遠い）／位置（上下・左右）／明るさ／動画か静止画か／カラーか白黒か／アソシエイトかディソシエイトか／立体か平面か／イメージの数／ふちがあるか、ないか</span></div>
<div class="kv"><span class="k">聞く（A）</span><span class="v">音量／音色（トーン）／テンポ／音の高さ／リズム／ステレオかモノラルか／続く長さ／距離（近い・遠い）／位置（上下・左右）／強さ</span></div>
<div class="kv"><span class="k">感じる（K）</span><span class="v">位置（体の内側か外側か）／向き（上下・左右）／さわった感じ・質感／重さ／温度／呼吸／動き</span></div>
</div>

<h3>対照分析 ― 2つの体験を並べて比べる</h3>
<p>対照分析は、<b>2つの体験を並べて、サブモダリティの違いを見つける</b>方法です。よく使うのは「うまくいく体験」と「苦手な体験」の組み合わせです。</p>
<p>比べてみると、その人にとって<b>「うまくいく感じ」をつくっている手がかり</b>が見えてきます。ここでは出来事の中身より、<b>感じ方の形</b>に注目するのがポイントです。</p>

<h3>やり方の流れ ― 例：会議で発言するのが苦手</h3>
<p>比べて違いが分かったら、苦手な感覚を、得意な感覚に変えていきます。全体を通して、<b>相手のペースに合わせながら</b>進めます。<br><button class="linkbtn" data-text="t5" type="button">5章「ラポール」を読む →</button></p>
<div class="kvs">
<div class="kv"><span class="k">① 苦手を聞く</span><span class="v">「苦手なことは何ですか？」「そのとき、どんな感覚がありますか？」「体では、どう感じますか？」<br><span style="color:var(--ink-3)">例：会議で発言するとき。お腹のあたりが固くなる。</span></span></div>
<div class="kv"><span class="k">② 得意を聞く</span><span class="v">「反対に、得意なこと、楽にできることは何ですか？」<br><span style="color:var(--ink-3)">例：仲のいい友だちと話しているとき。</span></span></div>
<div class="kv"><span class="k">③ 目の前に出す</span><span class="v">「その感覚を、あえて目の前に出すとしたら、どんな色・形・大きさですか？ さわった感じ・温度・重さは？」苦手と得意、それぞれに聞きます。</span></div>
</div>
<p>③で出てきた2つの感覚を並べると、たとえばこうなります。</p>
<div class="kvs">
<div class="kv"><span class="k">色</span><span class="v">苦手：灰色<br>得意：あたたかいオレンジ色</span></div>
<div class="kv"><span class="k">形・大きさ</span><span class="v">苦手：両手いっぱいの、ゴツゴツした塊<br>得意：手のひらにのる、まるい玉</span></div>
<div class="kv"><span class="k">さわった感じ</span><span class="v">苦手：固い<br>得意：やわらかい</span></div>
<div class="kv"><span class="k">温度</span><span class="v">苦手：冷たい<br>得意：ほんのりあたたかい</span></div>
<div class="kv"><span class="k">重さ</span><span class="v">苦手：ずっしり重い<br>得意：ふわっと軽い</span></div>
</div>
<div class="kvs">
<div class="kv"><span class="k">④ 得意に変える</span><span class="v">目の前の苦手な感覚を、得意な感覚の色・形・重さへ変えていきます。コーチは迷わず、流れるように言い切ります。<br><span style="color:var(--ink-3)">例：「その灰色の塊が、だんだんオレンジ色に変わっていきます。まるく、やわらかく、軽くなっていきます」</span></span></div>
<div class="kv"><span class="k">⑤ 確かめる</span><span class="v">「さっきの苦手なこと（会議で発言する場面）を思い出して、あの感覚になろうとしてみてください」<br><span style="color:var(--ink-3)">前ほどその感覚にならなければ、感じ方が変わったサインです。</span></span></div>
<div class="kv"><span class="k">⑥ 未来へ</span><span class="v">「これからどのように行動していこうとする自分がいますか？」次の行動を聞きます（未来ペーシング）。<br><span style="color:var(--ink-3)">例：次の会議では、最初にひとこと、自分の意見を言ってみる。</span></span></div>
</div>
<p>④の「言い切る」言葉の使い方は、13章のミルトンモデルで学びます。<br><button class="linkbtn" data-text="t13" type="button">13章「ミルトンモデル」を読む →</button></p>

<h3>コーチングの場面で</h3>
<ul>
<li><b>「どんな感じ？」の先を聞く。</b>「その場面は明るいですか、暗いですか」「近いですか、遠いですか」と聞くと、ぼんやりした気持ちが扱える形になります</li>
<li><b>相手の言葉に出るサブモダリティを拾う。</b>「目の前が真っ暗」「重くのしかかる」「遠い話に感じる」。こうした言い方には、その人の感じ方の形がそのまま出ています</li>
<li><b>出来事の中身を、くわしく聞き出さなくていい。</b>感じ方の形を聞くだけでも、話は進みます。話したくないことを話させずに済みます</li>
<li><b>変わらなくても、責めない。</b>どの要素が効くかは人によって違います。色で変わらなければ、重さや温度など、別の要素を試します</li>
<li><b>「ちょっと苦手」から始める。</b>つらい記憶や、心の傷になっている出来事には使いません。そうした話は、医療などの専門家につなぎます</li>
</ul>

<h3>ふり返ってみよう</h3>
<div class="kvs">
<div class="kv"><span class="k">問い 1</span><span class="v">楽しかった思い出を一つ浮かべてください。明るさ・大きさ・距離・色は、それぞれどうなっていますか。</span></div>
<div class="kv"><span class="k">問い 2</span><span class="v">その場面の明るさを少しだけ上げたり、写真を少し遠ざけたりしてみてください。感じ方に違いはありましたか。変わらなくてもかまいません。</span></div>
<div class="kv"><span class="k">問い 3</span><span class="v">「ちょっと苦手なこと」と「得意なこと」を一つずつ選んで、①〜③を自分に聞いてみてください。2つの感覚は、色・形・重さでどう違いましたか。</span></div>
</div>

<div class="srcbox">出典：『NLPプラクティショナー』テキスト（米国NLP協会™ NLP創始者認定講座）<br>サブモダリティの意味、アナログとデジタルの2つのタイプ、アソシエイト／ディソシエイト、視覚・聴覚・身体感覚の要素の一覧、2つの体験を並べて比べる対照分析の形は教科書に沿っています。苦手と得意を聞いて感覚を変えていく流れ（①〜⑥）は、講座で学んだ手順をもとに、このアプリの言葉でまとめました。対照分析の説明の言い方、会議の例、コーチングの場面、ふり返りの問いは、このアプリで作りました。サブモダリティを変えたときの感じ方の変化は人によって違うため、このアプリでは「変わることがある」と紹介しています。<br>※このアプリは個人が作った練習用で、講座や協会の公式のものではありません。</div>` },
  { id:"t12", no:"12", title:"メタモデル", min:12, body:`<div class="hitokoto">人は話すとき、知らないうちに情報を<b>省いたり、ゆがめたり、ひとまとめにしたり</b>しています。質問で、抜け落ちた情報を取り戻す。それがメタモデルです。</div>

<h3>メタモデルとは</h3>
<p>人は、見たり聞いたりしたことを、自分のフィルターを通して受け取ります。このとき情報の一部が<b>削除</b>され、<b>歪曲</b>され、<b>一般化</b>されます。言葉にして外に出すときも、同じことが起きます。<br><button class="linkbtn" data-text="t7" type="button">7章「表象システム」を読み返す →</button></p>
<p>こうして情報が欠けてしまった言葉を<b>メタモデルパターン</b>と呼びます。そこに質問をして、抜け落ちた情報を取り戻す（回復させる）のがメタモデルです。</p>
<p>情報が戻ってくると、相手は自分の状況をはっきり見られるようになります。自分の持っている力（リソース）に気づいたり、必要なものとそうでないものを分けたりしやすくなります。</p>

<h3>何のために使うか</h3>
<ul>
<li><b>はっきりさせる</b>（ゴールなど）</li>
<li><b>具体的にする</b></li>
<li><b>必要なものと、必要でないものを分ける</b></li>
<li><b>必要でない思い込み（ビリーフ）を変える</b></li>
<li><b>進む方向を決める</b></li>
<li><b>リソースに目を向ける</b></li>
</ul>

<h3>12のパターン</h3>
<p class="note" style="margin:0 0 10px">「例」は相手の言葉、「→」はそれに返す回復質問です。</p>
<p><b>削除 ― 情報が抜けている</b></p>
<div class="kvs">
<div class="kv"><span class="k">一般削除</span><span class="v">例「不安です」<br>→「何に対して、不安ですか？」</span></div>
<div class="kv"><span class="k">比較削除</span><span class="v">例「もっと頑張らないと」<br>→「何と比べて、もっとですか？」</span></div>
<div class="kv"><span class="k">指示詞の欠如</span><span class="v">例「上から言われたんです」<br>→「具体的に、誰に言われたのですか？」</span></div>
<div class="kv"><span class="k">不特定動詞</span><span class="v">例「ちゃんと準備したんです」<br>→「具体的に、どのように準備したのですか？」</span></div>
</div>
<p><b>歪曲 ― 意味がゆがんでいる</b></p>
<div class="kvs">
<div class="kv"><span class="k">名詞化</span><span class="v">例「コミュニケーションがうまくいかない」<br>→「誰と、どのように話すことが、うまくいかないのですか？」</span></div>
<div class="kv"><span class="k">複合等価</span><span class="v">例「返信が遅いのは、嫌われてるってことです」<br>→「返信が遅い＝嫌われている、なんですね。あなたがすぐに返信できなかったとき、その相手を嫌っていましたか？」</span></div>
<div class="kv"><span class="k">因果関係</span><span class="v">例「あの人のせいで、やる気がなくなった」<br>→「あの人の言動をどう解釈したから、やる気がなくなったと言えるのでしょうか？」</span></div>
<div class="kv"><span class="k">マインド・リーディング</span><span class="v">例「上司は、私に期待していない」<br>→「どうやって、それが分かるのですか？」</span></div>
<div class="kv"><span class="k">ロスト・パフォーマティブ</span><span class="v">例「失敗するのは、よくないことだ」<br>→「誰にとって、よくないことなのですか？」</span></div>
</div>
<p><b>一般化 ― ひとまとめにしている</b></p>
<div class="kvs">
<div class="kv"><span class="k">全称限定詞</span><span class="v">例「いつも失敗する」<br>→「いつも？ うまくいったことは、一度もありませんか？」</span></div>
<div class="kv"><span class="k">可能性のモダルオペレーター</span><span class="v">例「人前で話すなんて、私には無理です」<br>→「何が、あなたを止めているのですか？」</span></div>
<div class="kv"><span class="k">必要性のモダルオペレーター</span><span class="v">例「毎日やらなければならない」<br>→「もし、やらなかったとしたら、何が起こりますか？」</span></div>
</div>
<p class="note">文の中に、言葉にされないまま入っている思い込み（前提）も、一般化の仲間として扱うことがあります。前提は、13章のミルトンモデルで詳しく学びます。<br><button class="linkbtn" data-text="t13" type="button">13章「ミルトンモデル」を読む →</button></p>

<h3>「なぜ」は、基本的に使わない</h3>
<p>「なぜ？」と聞かれると、人は責められているように感じ、言い訳が出てきやすくなります。代わりに<b>「何が」「どのように」「何と比べて」</b>で聞きます。</p>
<p>ただし「なぜ」は、その人の<b>動機</b>を引き出す質問でもあります。目標や大事にしていること、やる気について聞くときには、あえて使うと効くことがあります。</p>

<h3>ミルトンモデルとの関係</h3>
<p>メタモデルは、情報を取り戻して<b>具体的にする</b>言葉の使い方です。ミルトンモデルはその反対で、<b>あえて情報をぼかす</b>ことで、相手が自分の体験で空白を埋められるようにします。トップの「A 単発ドリル」「B 連結ドリル」は、ミルトンモデルの側の練習です。</p>

<h3>コーチングの場面で</h3>
<ul>
<li><b>全部を回復させようとしない。</b>一度にいくつも聞くと、取り調べのようになります。ゴールや、相手を止めているものなど、大事なところだけ聞きます</li>
<li><b>相手の言葉をそのまま使って聞く。</b>「不安」と言われたら、「その不安は、何に対してですか？」と、同じ言葉で返します</li>
<li><b>ラポールがあってこそ。</b>信頼がないうちに鋭く聞くと、責められているように感じます<br><button class="linkbtn" data-text="t5" type="button">5章「ラポール」を読む →</button></li>
<li><b>ゴールを整えるときに使う。</b>ぼんやりしたゴールは、削除や名詞化だらけです。回復質問で、見える形にしていきます<br><button class="linkbtn" data-text="t4" type="button">4章「よくまとめられたゴール」を読む →</button></li>
<li><b>相手の地図を否定しない。</b>「それは違いますよ」ではなく、まだ地図に載っていない情報を一緒に探します</li>
</ul>

<h3>人と組んでやるワーク</h3>
<ul>
<li><b>書き出して、質問する</b>（2〜3人）… 身の回りでよく聞く「情報が欠けた言葉」を、話し合いながら書き出す。書き出した言葉に、メタモデルで質問してみる</li>
</ul>

<h3>ふり返ってみよう</h3>
<div class="kvs">
<div class="kv"><span class="k">問い 1</span><span class="v">最近あなたが口にした「いつも」「みんな」「〜しなきゃ」を、一つ思い出してください。どのパターンに当たりますか。</span></div>
<div class="kv"><span class="k">問い 2</span><span class="v">その言葉に、自分で回復質問をしてみてください。何が出てきましたか。</span></div>
<div class="kv"><span class="k">問い 3</span><span class="v">あなたがつい「なぜ？」と聞いてしまうのは、どんな場面ですか。「何が」「どのように」に言いかえると、どうなりますか。</span></div>
</div>

<p>この章の練習は、トップの「M メタモデル」から回せます。長い語りの中から削除・歪曲・一般化を見つけて、回復質問を作る練習です。<br><button class="linkbtn" data-go="metapick" type="button">メタモデルの長文ワークへ →</button></p>

<div class="srcbox">出典：『NLPプラクティショナー』テキスト（米国NLP協会™ NLP創始者認定講座）<br>メタモデルの意味、削除・歪曲・一般化とフィルターの考え方、メタモデルパターンと情報の回復、目的の6つ、12のパターンの名前と3つの分け方、回復質問の型、「なぜ」を基本的に使わない理由とあえて使う場合、ミルトンモデルとの関係、ワークの流れは教科書に沿っています。パターンの数え方は講座の資料に合わせ、モダルオペレーターを可能性と必要性の2つに分けています。例文と回復質問の言い方、コーチングの場面、ふり返りの問いは、このアプリで作りました。<br>※このアプリは個人が作った練習用で、講座や協会の公式のものではありません。</div>` },
  { id:"t13", no:"13", title:"ミルトンモデル", min:14, body:`<div class="hitokoto">12章のメタモデルは、抜け落ちた情報を<b>取り戻す</b>言葉でした。ミルトンモデルはその反対で、情報を<b>あえてぼかす</b>ことで、相手が自分の体験で空白を埋められるようにする言葉です。</div>

<h3>ミルトンモデルとは</h3>
<p>催眠療法家のミルトン・エリクソン（1901〜1980）が使っていた言葉のパターンを、分析して体系にまとめたものです。今はリチャード・バンドラーによって、さらに磨かれた形で使われています。<br><button class="linkbtn" data-text="t12" type="button">12章「メタモデル」を読み返す →</button></p>
<p>たとえば「あなたの中で、何かが変わり始めています」。何が、どう変わるのかは言っていません。だから聞いた人は、<b>自分にとって一番ぴったりくる意味</b>を、自分の中から探して当てはめます。</p>

<h3>何がいいのか</h3>
<ul>
<li><b>相手の地図とぶつかりにくい。</b>こちらが具体的に言いすぎないので、相手の体験に合わないことを言ってしまう心配が減ります</li>
<li><b>ペーシングがしやすい。</b>相手が「そうだ」と思えることから入って、望む方向へつなげられます</li>
<li><b>相手が自分で意味をつける。</b>押しつけられた答えではなく、自分で見つけた答えとして受け取れます</li>
<li><b>新しい考え方を取り入れやすい。</b>考えすぎて反論する前に、すっと受け取れることがあります</li>
</ul>

<h3>6つのグループ</h3>
<p class="note" style="margin:0 0 10px">太字のパターンは、トップの「A 単発ドリル」で練習できます。</p>

<p><b>1. 逆メタモデル ― メタモデルの裏返し</b></p>
<div class="kvs">
<div class="kv"><span class="k">削除</span><span class="v">情報を抜いて、相手に集めてもらう。<br><b>削除</b>／<b>不特定な指示詞</b>／<b>不特定動詞</b>／<b>名詞化</b><br><span style="color:var(--ink-3)">例：人は誰でも、自分に合った答えを見つけることができます。</span></span></div>
<div class="kv"><span class="k">歪曲</span><span class="v">つながっていないものを、つながっているように言う。<br><b>複合等価</b>／因果関係のモデリング（ペーシングの「関連付け」と同じ）／<b>マインド・リーディング</b>／<b>ロスト・パフォーマティブ</b><br><span style="color:var(--ink-3)">例：ここまで話してくれたということは、もう動き出しているということです。</span></span></div>
<div class="kv"><span class="k">一般化</span><span class="v">話し手の側で、ひとまとめにして言い切る。<br><b>全称限定詞</b>／<b>必要性・可能性のモダルオペレーター</b>／前提（→ 2.へ）<br><span style="color:var(--ink-3)">例：誰にでも、うまくいった日は必ずあります。</span></span></div>
</div>
<p class="note">名詞化は、12章のメタモデルでは「歪曲」に入れていましたが、ミルトンモデルでは「削除」の仲間として扱います。どちらも「中身が抜けている」ことに変わりはありません。</p>

<p><b>2. 前提 ― そうなることを前提にして話す</b></p>
<div class="kvs">
<div class="kv"><span class="k">7つ</span><span class="v"><b>時の従属節</b>／<b>時の変化の副詞と動詞</b>／<b>順序を表す言葉</b>／<b>あるいは、それとも</b>／<b>意識の叙述語</b>／<b>注釈の形容詞と副詞</b>／<b>副詞と形容詞</b><br><span style="color:var(--ink-3)">例：次の一歩を、今日にしますか、それとも明日にしますか？（どちらを選んでも「一歩を踏み出す」ことが前提になっています）</span></span></div>
</div>

<p><b>3. 間接的誘導 ― 直接たのまずに、反応を引き出す</b></p>
<div class="kvs">
<div class="kv"><span class="k">6つ</span><span class="v"><b>埋め込まれた命令</b>／<b>埋め込まれた質問</b>／<b>会話的要求</b>／<b>否定命令</b>／<b>アナログマーキング</b>／アンビギュイティ（あいまいさ）<br><span style="color:var(--ink-3)">例：あなたがこの1週間で、何を試してみたくなるのかな、と考えています。</span></span></div>
</div>

<p><b>4. 付加疑問 ― 最後に問いかけを添える</b></p>
<div class="kvs">
<div class="kv"><span class="k">1つ</span><span class="v"><b>付加疑問</b><br><span style="color:var(--ink-3)">例：少しずつ、見えてきていますよね？</span></span></div>
</div>

<p><b>5. ペーシング ― 相手の体験に合わせて、望む方向へつなぐ</b></p>
<div class="kvs">
<div class="kv"><span class="k">4つ</span><span class="v">関連付け（<b>接続詞</b> → <b>時間</b> → <b>因果</b>。弱い順に使う）／<b>活用</b>／<b>トゥルイズム</b>／<b>イエスセット</b><br><span style="color:var(--ink-3)">例：いま、ここに座って話しています。そして、話しながら、少しずつ気持ちが整っていきます。</span></span></div>
</div>

<p><b>6. メタファー ― たとえで伝える</b></p>
<div class="kvs">
<div class="kv"><span class="k">4つ</span><span class="v"><b>選択的な制限違反</b>（ありえない言い方で伝える）／<b>引用</b>／寓話・逸話・ストーリー・物語／同型・準同型（相手の状況に合わせた物語）<br><span style="color:var(--ink-3)">例：種は、土の中にいる間がいちばん忙しいんですよね。</span></span></div>
</div>

<h3>コーチングの場面で</h3>
<ul>
<li><b>ペーシングが先。</b>相手が「そうだ」と思えることから入ります。いきなり望む方向へ引っぱると、抵抗が出ます<br><button class="linkbtn" data-text="t5" type="button">5章「ラポール」を読む →</button></li>
<li><b>言い切るところは、迷わず言い切る。</b>11章で苦手な感覚を得意な感覚に変えるときの「〜なっていきます」も、ミルトンモデルの言葉です<br><button class="linkbtn" data-text="t11" type="button">11章「サブモダリティ」を読む →</button></li>
<li><b>選択肢を渡す。</b>「やるか、やらないか」ではなく、「どちらから始めるか」を選んでもらうと、相手は自分で決めた感覚を持てます</li>
<li><b>具体的に言いすぎない。</b>励ましの言葉も、中身を相手に埋めてもらうと、その人に合ったものになります</li>
<li><b>相手が望む方向にだけ使う。</b>ミルトンモデルは、人に影響を与える言葉です。相手がめざしているゴールのために使い、こちらの都合で人を動かすためには使いません</li>
</ul>

<h3>人と組んでやるワーク</h3>
<ul>
<li><b>メタファーで話そう</b>（2人）… Aは、いまうまくいっていないことと、そのことの望ましい状態を簡単に話す。Bは、Aに役立ちそうな新しい考え方や行動、うまくいく方法などを、たとえ話にして話す。Aは、聞いて感じたことをフィードバックする。終わったら交代</li>
</ul>

<h3>ふり返ってみよう</h3>
<div class="kvs">
<div class="kv"><span class="k">問い 1</span><span class="v">誰かに言われて、自分なりの意味を見つけた「あいまいな言葉」はありますか。それはどんな言葉でしたか。</span></div>
<div class="kv"><span class="k">問い 2</span><span class="v">あなたがつい具体的に言いすぎてしまう場面はどこですか。中身を相手に任せるとしたら、どう言いかえますか。</span></div>
<div class="kv"><span class="k">問い 3</span><span class="v">いま取り組んでいることを、たとえ話にすると何になりますか。</span></div>
</div>

<p>この章の練習は、トップの「A 単発ドリル」と「B 連結ドリル」で回せます。<br><button class="linkbtn" data-go="single" type="button">単発ドリルへ →</button>　<button class="linkbtn" data-go="stackpick" type="button">連結ドリルへ →</button></p>

<div class="srcbox">出典：『NLPプラクティショナー』テキスト（米国NLP協会™ NLP創始者認定講座）<br>ミルトンモデルの意味と成り立ち、メタモデルとの関係、6つのグループとそれぞれのパターンの名前、逆メタモデルの削除・歪曲・一般化の分け方、ミルトンモデルの効果、関連付けを弱い順に使うこと、メタファーのワークの流れは教科書に沿っています。例文、コーチングの場面、ふり返りの問いは、このアプリで作りました。<br>※このアプリは個人が作った練習用で、講座や協会の公式のものではありません。</div>` },
  { id:"t14", no:"14", title:"アンカリング", min:12, body:`<div class="hitokoto">ある音楽を聞くと、その頃の気持ちがよみがえる。そんなふうに<b>「きっかけ」と「気持ち」が結びつく</b>ことは、誰にでも起きています。それを自分で意図して作るのが、アンカリングです。</div>

<h3>アンカリングとは</h3>
<p>雨上がりの土のにおいで、子どもの頃の帰り道を思い出す。運動会で流れていた曲を聞くと、なんだか体がそわそわする。実家の玄関を開けると、ほっとする。</p>
<p>こうした結びつきは、普段は<b>たまたま</b>できています。アンカリングは、これを<b>意図して作ること</b>。ある刺激（きっかけ）と、ある反応（気持ちや体の状態）を結びつけます。このきっかけを<b>アンカー</b>（船のいかり）と呼び、アンカーを使って気持ちを呼び起こすことを<b>「発火させる」</b>といいます。</p>
<p>緊張・怖れ・落ちこみのままでは、人は力を出しきれません。そんなときに、<b>前に味わった良い状態へ、すっと戻る</b>ための道具がアンカリングです。</p>
<p>ここで使う「インステイト（その状態に入る）」「ブレイクステイト（いったんリセットする）」は、9章で学びました。<br><button class="linkbtn" data-text="t9" type="button">9章「ステイト」を読み返す →</button></p>

<h3>うまく結びつけるための5つの条件</h3>
<div class="kvs">
<div class="kv"><span class="k">① ユニーク</span><span class="v">普段の癖や、毎日やる動作は選ばない。腕を組む・髪をさわるのように、いつもやっていることだと、別の気持ちと混ざってしまいます。<br><span style="color:var(--ink-3)">例：左手の親指と中指の先を、軽く合わせる。</span></span></div>
<div class="kv"><span class="k">② 同じ刺激</span><span class="v">毎回、同じ場所・同じ強さで。作ったときと試すときで、さわる場所や強さが変わらないようにします。</span></div>
<div class="kv"><span class="k">③ しっかり入る</span><span class="v">その体験に<b>十分に入りこんでいる</b>ときにかける。体験が強いほど、発火したときの反応も強くなります。</span></div>
<div class="kv"><span class="k">④ タイミング</span><span class="v">気持ちは、盛り上がって頂上をこえると下がっていきます。だから<b>頂上の少し手前</b>でかけます。</span></div>
<div class="kv"><span class="k">⑤ リフレッシュ</span><span class="v">結びつきは、使わないと少しずつ弱まります。ときどき作り直せるように、<b>繰り返しやれるきっかけ</b>を選びます。</span></div>
</div>

<h3>アンカーは五感のどれでも作れる</h3>
<div class="kvs">
<div class="kv"><span class="k">見る</span><span class="v">机の前に貼った、一枚の写真</span></div>
<div class="kv"><span class="k">聞く</span><span class="v">本番の前にだけ聞く、決まった一曲</span></div>
<div class="kv"><span class="k">体で感じる</span><span class="v">親指と中指を合わせる／胸に手を当てる</span></div>
<div class="kv"><span class="k">におい</span><span class="v">勉強を始めるときにだけ使う、ハンドクリームの香り</span></div>
<div class="kv"><span class="k">味</span><span class="v">試合の朝にだけ飲む、あたたかいお茶</span></div>
</div>
<p>コーチングでは、体の動き（体で感じる）がよく使われます。いつでも、どこでも、同じように繰り返せるからです。</p>

<h3>基本の形 ― リソースアンカー</h3>
<p>自分に必要な力（リソース）を、一つのきっかけに結びつけます。1章の前提「変わるための力は、もう自分の中にある」を、形にしたものです。<br><span style="color:var(--ink-3)">例：大事な面談の前に、落ち着きを取り戻したい。</span></p>
<div class="kvs">
<div class="kv"><span class="k">① 決める</span><span class="v">どんなリソースがほしいか（落ち着き・ワクワク・自信など）と、アンカーにするきっかけを決めます。<br><span style="color:var(--ink-3)">例：リソースは「落ち着き」。きっかけは、左手の親指と中指を軽く合わせる。</span></span></div>
<div class="kv"><span class="k">② 何も起きないか確かめる</span><span class="v">まず、きっかけだけをやってみます。<b>この時点では、何も変わらない</b>ことを確かめておきます（あとで変化が出たとき、アンカーの効果だと分かるように）。</span></div>
<div class="kv"><span class="k">③ 入って、かける</span><span class="v">落ち着いていたときの体験を一つ思い出し、そこに入っていきます。十分に入って、<b>気持ちが頂上に近づいたところ</b>できっかけをやります。何回か繰り返します。<br><span style="color:var(--ink-3)">ガイド役の問いかけ例：「すごく落ち着いていたときを、一つ思い出してください。そのとき、何が見えていますか。何が聞こえますか。体はどんな感じですか」</span></span></div>
<div class="kv"><span class="k">④ 確かめる（テスト）</span><span class="v">いったん別の話をして状態をリセットしてから（ブレイクステイト）、きっかけだけをやります。さっきの落ち着きが戻ってくれば、結びついています。</span></div>
<div class="kv"><span class="k">⑤ 未来へ</span><span class="v">「このアンカーを使って、これからどのように行動していこうとする自分がいますか？」次の行動を聞きます（未来ペーシング）。<br><span style="color:var(--ink-3)">例：面談の部屋に入る前に、指を合わせてから、ドアを開ける。</span></span></div>
</div>
<p>③で「何が見えて、何が聞こえて、体はどんな感じか」と聞くのは、7章の見る・聞く・感じるを使って、体験に<b>入りこみやすくする</b>ためです。<br><button class="linkbtn" data-text="t7" type="button">7章「表象システム」を読み返す →</button></p>

<h3>4つのバリエーション</h3>
<p>基本の形を組み合わせると、いろいろな場面に使えます。</p>
<div class="kvs">
<div class="kv"><span class="k">スタッキング<br>（積み重ねる）</span><span class="v">いくつかのリソースを、<b>同じ場所</b>に重ねて、もっと力強い状態をつくります。一つかけるたびに、ブレイクステイトをはさむのがポイントです。<br><span style="color:var(--ink-3)">例：「落ち着き」「ワクワク」「やりきった自信」の3つを、同じ指の合わせ方に重ねる。</span></span></div>
<div class="kv"><span class="k">スライディング<br>（ふくらませる）</span><span class="v">リソースアンカーを発火させながら、腕などに沿って手をすべらせ、「5倍、10倍、100倍になります」と伝えて、<b>感じ方を大きく</b>していきます。「シューッ」のような音もいっしょに使います。</span></div>
<div class="kv"><span class="k">コラプシング<br>（打ち消し合わせる）</span><span class="v">いやな反応のアンカー（マイナス）と、良い状態のアンカー（プラス）を<b>別々の場所</b>に作り、<b>同時に</b>発火させて、マイナスの反応をやわらげます。プラスの方を、マイナスより<b>ずっと強く</b>しておきます（目安は5倍以上。スタッキングやスライディングで強めます）。<br><span style="color:var(--ink-3)">いやな体験の中身は、聞かなくてかまいません。</span></span></div>
<div class="kv"><span class="k">チェイニング<br>（つなげる）</span><span class="v">いまの状態と、なりたい状態が<b>離れすぎている</b>とき、間にいくつかの状態をはさんで、アンカーを鎖のようにつなぎます。一つ目を発火させたら、その感じが残っているうちに次を発火させ、最後までつなげていきます。<br><span style="color:var(--ink-3)">例：何もしたくない ⇒ むずむずする ⇒ 落ち着いている ⇒ ちょっとやってみたい ⇒ 始めたくてたまらない</span></span></div>
</div>
<p>スライディングの「大きくしていく」は、11章のサブモダリティを動かす考え方とつながっています。<br><button class="linkbtn" data-text="t11" type="button">11章「サブモダリティ」を読み返す →</button></p>

<h3>コーチングの場面で</h3>
<ul>
<li><b>体にふれる前に、必ず聞く。</b>ガイド役が相手の手や腕にふれるときは、先に「ここに軽くふれてもいいですか」と許可をもらいます。ふれられるのが苦手な人や、オンラインのときは、<b>相手が自分でやる動き</b>をアンカーにします</li>
<li><b>相手の「うまくいった体験」を見つける。</b>リソースは、相手の中にもうあります。「落ち着いていたときは？」「夢中になれたときは？」と、小さな体験でも拾います</li>
<li><b>「頂上の少し手前」を見る。</b>表情・呼吸・姿勢の変化を観察して、タイミングをつかみます<br><button class="linkbtn" data-text="t6" type="button">6章「キャリブレーション」を読む →</button></li>
<li><b>自分で使えるように渡す。</b>セッションの中だけで終わらせず、本番の前に自分で発火させる場面まで、一緒に決めておきます</li>
<li><b>「ちょっと苦手」から始める。</b>コラプシングのように、いやな反応を扱うときは、軽いものから。つらい記憶や、心の傷になっている出来事には使いません。そうした話は、医療などの専門家につなぎます</li>
<li><b>効き方は人それぞれ。</b>一回で変わる人もいれば、何度か繰り返して結びつく人もいます。変わらなくても、責めずに、きっかけや体験を選び直します</li>
</ul>

<h3>人と組んでやるワーク</h3>
<ul>
<li><b>リソースアンカー</b>（2人）… AとBに分かれる。Aは、ほしいリソースとアンカーのきっかけを決める。Bは、Aが体験に十分に入れるように問いかけてリードし、Aは頂上の少し手前でアンカーをかける（何回か繰り返す）。テストと未来ペーシングをしたら、交代。最後に感想を伝え合う</li>
</ul>

<h3>手順の問い ― ガイド役なら、どうする？</h3>
<p>それぞれの場面を読んで、どこを直すとよいか考えてから、開いてみましょう。</p>
<details class="ref pp"><summary><span class="no">問い 1</span>アンカーのきっかけに「腕を組む」を選んだ。</summary><div class="body">
<div class="kv"><span class="k">見るところ</span><span class="v">① ユニーク</span></div>
<div class="kv"><span class="k">考え方</span><span class="v">腕を組むのは、考えごとをするときや、寒いときにもやる、普段の動作です。別の気持ちと混ざりやすいので、普段やらない動きにします。</span></div>
</div></details>
<details class="ref pp"><summary><span class="no">問い 2</span>相手が思い出して、いちばん盛り上がったあと、少し落ち着いてきたところでアンカーをかけた。</summary><div class="body">
<div class="kv"><span class="k">見るところ</span><span class="v">④ タイミング</span></div>
<div class="kv"><span class="k">考え方</span><span class="v">頂上をこえると、気持ちは下がっていきます。表情や呼吸が高まっていく途中、<b>頂上の少し手前</b>でかけます。</span></div>
</div></details>
<details class="ref pp"><summary><span class="no">問い 3</span>作るときは右の手首を軽くにぎった。テストでは、左の手首を強めににぎった。</summary><div class="body">
<div class="kv"><span class="k">見るところ</span><span class="v">② 同じ刺激</span></div>
<div class="kv"><span class="k">考え方</span><span class="v">場所も強さも変わっています。作ったときと<b>同じ場所・同じ強さ</b>で発火させます。</span></div>
</div></details>
<details class="ref pp"><summary><span class="no">問い 4</span>スタッキングで、「落ち着き」「ワクワク」「自信」を、休まず続けてかけた。</summary><div class="body">
<div class="kv"><span class="k">見るところ</span><span class="v">ブレイクステイト</span></div>
<div class="kv"><span class="k">考え方</span><span class="v">一つかけるたびに、いったん状態をリセットしてから、次の体験に入ります。そうすると、それぞれの状態にしっかり入れます。</span></div>
</div></details>
<details class="ref pp"><summary><span class="no">問い 5</span>コラプシングで、いやな体験の中身を、くわしく話してもらった。</summary><div class="body">
<div class="kv"><span class="k">見るところ</span><span class="v">中身は聞かなくていい</span></div>
<div class="kv"><span class="k">考え方</span><span class="v">話すたびに、いやな状態に深く入ってしまいます。中身は本人の中にあれば十分です。そして、プラスのアンカーをマイナスよりずっと強くしておくことに力を使います。</span></div>
</div></details>
<details class="ref pp"><summary><span class="no">問い 6</span>テストのあと、「次の場面を思い浮かべると、どんな感じがしますか？」と聞いて終わった。</summary><div class="body">
<div class="kv"><span class="k">見るところ</span><span class="v">未来ペーシング</span></div>
<div class="kv"><span class="k">考え方</span><span class="v">未来ペーシングは、<b>次の行動を聞く</b>質問です。「このアンカーを使って、これからどのように行動していこうとする自分がいますか？」と聞きます。</span></div>
</div></details>
<details class="ref pp"><summary><span class="no">問い 7</span>3か月前に作ったアンカーが、最近あまり効かなくなった。</summary><div class="body">
<div class="kv"><span class="k">見るところ</span><span class="v">⑤ リフレッシュ</span></div>
<div class="kv"><span class="k">考え方</span><span class="v">結びつきは、少しずつ弱まるものです。失敗ではありません。もう一度その体験に入って、同じきっかけでかけ直します。</span></div>
</div></details>

<h3>ふり返ってみよう</h3>
