/* ===================== イベント ===================== */
function wire(){
  app.querySelectorAll("[data-go]").forEach(el => {
    el.addEventListener("click", () => {
      const g = el.dataset.go;
      stopTimer();
      delAskIx = null; delAllAsk = false;
      if(g === "single"){ start("single", false); }
      else if(g === "reframe"){ startRf(); }
      else if(g === "goal"){ startGl(); }
      else if(g === "vak"){ startVk(); }
      else if(g === "chunk"){ startCh(); }
      else if(g === "weak"){ start("single", true); }
      else { view = g; render(); }
    });
  });

  app.querySelectorAll("[data-text]").forEach(el => {
    el.addEventListener("click", () => { curText = el.dataset.text; view = "chapter"; render(); });
  });
  app.querySelectorAll("[data-read]").forEach(el => {
    el.addEventListener("click", () => {
      const id = el.dataset.read;
      if(!store.read.includes(id)){ store.read.push(id); save(); }
      if(el.dataset.next){ curText = el.dataset.next; view = "chapter"; }
      else { view = "textbook"; }
      render();
    });
  });

  app.querySelectorAll("[data-mono]").forEach(el => {
    el.addEventListener("click", () => { stopTimer(); startMeta(el.dataset.mono); });
  });

  app.querySelectorAll("[data-pick]").forEach(el => {
    el.addEventListener("click", () => { picked = el.dataset.pick; render(); });
  });

  const ns = document.getElementById("nextspot");
  if(ns) ns.addEventListener("click", () => {
    record(curMono.spots[spotIx].p, verdictOf(checked.filter(Boolean).length));
    nextSpot();
  });

  app.querySelectorAll("[data-seq]").forEach(el => {
    el.addEventListener("click", () => { seqPick = el.dataset.seq; start("stack", false); });
  });

  const seg = document.getElementById("segtimer");
  if(seg) seg.querySelectorAll("button").forEach(b => {
    b.addEventListener("click", () => { store.timer = Number(b.dataset.t); save(); render(); });
  });

  const segl = document.getElementById("seglevel");
  if(segl) segl.querySelectorAll("button").forEach(b => {
    b.addEventListener("click", () => { store.level = b.dataset.l; save(); render(); });
  });

  const segf = document.getElementById("segfont");
  if(segf) segf.querySelectorAll("button").forEach(b => {
    b.addEventListener("click", () => { store.fs = Number(b.dataset.f); save(); applyFontSize(); render(); });
  });

  app.querySelectorAll("[data-gdone]").forEach(b => {
    b.addEventListener("click", () => {
      grabGl();
      const id = b.dataset.gdone;
      glDone[id] = !glDone[id];
      keepScroll = true; render();
    });
  });

  const gl2 = document.getElementById("glreveal");
  if(gl2) gl2.addEventListener("click", () => {
    stopTimer(); grabGl();
    lastWrite = GOAL_COND.map(c => glDone[c.id] ? "（もう入っている）" : (glAns[c.id] || "").trim());
    noteSaved = false; noteDraft = null; glStep = 2; render();
  });

  const gl3 = document.getElementById("glnextq");
  if(gl3) gl3.addEventListener("click", () => {
    record("glq", verdictOf(checked.filter(Boolean).length));
    startGl();
  });

  app.querySelectorAll("[data-useex]").forEach(b => {
    b.addEventListener("click", () => {
      const d = noteData(); if(!d) return;
      const ta = document.getElementById("notedraft");
      const now = ta ? ta.value : (noteDraft || "");
      const add = d.models[Number(b.dataset.useex)];
      noteDraft = (now.trim() ? now.replace(/\s+$/, "") + "\n" : "") + add;
      keepScroll = true;
      render();
    });
  });

  const sn = document.getElementById("savenote");
  if(sn) sn.addEventListener("click", () => {
    const ta = document.getElementById("notedraft");
    keepScroll = true;
    saveNote(ta ? ta.value : "");
  });

  app.querySelectorAll("[data-editnote]").forEach(b => {
    b.addEventListener("click", () => { noteEditIx = Number(b.dataset.editnote); keepScroll = true; render(); });
  });
  const ce = document.getElementById("canceledit");
  if(ce) ce.addEventListener("click", () => { noteEditIx = null; keepScroll = true; render(); });
  app.querySelectorAll("[data-saveedit]").forEach(b => {
    b.addEventListener("click", () => {
      const ta = document.getElementById("editnote");
      const i = Number(b.dataset.saveedit);
      const v = ta ? ta.value.trim() : "";
      if(v) store.notes[i].text = v;
      noteEditIx = null; keepScroll = true; save(); render();
    });
  });

  app.querySelectorAll("[data-delnote]").forEach(b => {
    b.addEventListener("click", () => { delAskIx = Number(b.dataset.delnote); keepScroll = true; render(); });
  });
  app.querySelectorAll("[data-delyes]").forEach(b => {
    b.addEventListener("click", () => {
      store.notes.splice(Number(b.dataset.delyes), 1);
      delAskIx = null; noteEditIx = null; keepScroll = true; save(); render();
    });
  });
  const dn = document.getElementById("delno");
  if(dn) dn.addEventListener("click", () => { delAskIx = null; keepScroll = true; render(); });

  const cn = document.getElementById("copynotes");
  if(cn) cn.addEventListener("click", () => {
    const text = store.notes.map(noteText).join("\n\n----------\n\n");
    const msg = document.getElementById("copymsg");
    const done = () => { if(msg) msg.textContent = "コピーしました。メモアプリなどに貼り付けてください。"; };
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done, msg));
    } else { fallbackCopy(text, done, msg); }
  });

  const cln = document.getElementById("clearnotes");
  if(cln) cln.addEventListener("click", () => { delAllAsk = true; keepScroll = true; render(); });
  const cly = document.getElementById("clearyes");
  if(cly) cly.addEventListener("click", () => {
    store.notes = []; noteEditIx = null; delAllAsk = false; delAskIx = null; save(); render();
  });
  const cln2 = document.getElementById("clearno");
  if(cln2) cln2.addEventListener("click", () => { delAllAsk = false; keepScroll = true; render(); });

  app.querySelectorAll("[data-vk]").forEach(b => {
    b.addEventListener("click", () => { vkPick = b.dataset.vk; keepScroll = true; render(); });
  });
  const vk1 = document.getElementById("vknext");
  if(vk1) vk1.addEventListener("click", () => { vkStep = 2; render(); startTimer(); });
  const vk2 = document.getElementById("vkreveal");
  if(vk2) vk2.addEventListener("click", () => {
    stopTimer(); grabWrite(["vkans1","vkans2"]);
    noteSaved = false; noteDraft = null; vkStep = 3; render();
  });
  const vk3 = document.getElementById("vknextq");
  if(vk3) vk3.addEventListener("click", () => {
    record("vkp", vkPick === curVk.sense ? "o" : "t");
    record("vkr", verdictOf(checked.filter(Boolean).length));
    startVk();
  });

  app.querySelectorAll("[data-ch]").forEach(b => {
    b.addEventListener("click", () => { chPick = b.dataset.ch; keepScroll = true; render(); });
  });
  const ch1 = document.getElementById("chnext");
  if(ch1) ch1.addEventListener("click", () => { chStep = 2; render(); startTimer(); });
  const ch2 = document.getElementById("chreveal");
  if(ch2) ch2.addEventListener("click", () => {
    stopTimer(); grabWrite(["chans1","chans2"]);
    noteSaved = false; noteDraft = null; chStep = 3; render();
  });
  const ch3 = document.getElementById("chnextq");
  if(ch3) ch3.addEventListener("click", () => {
    record("chp", chPick === curCh.dir ? "o" : "t");
    record("chq", verdictOf(checked.filter(Boolean).length));
    startCh();
  });

  app.querySelectorAll("[data-eye]").forEach(b => {
    b.addEventListener("click", () => { eyeView = b.dataset.eye; keepScroll = true; render(); });
  });

  const rf1 = document.getElementById("rfnext");
  if(rf1) rf1.addEventListener("click", () => { stopTimer(); grabWrite(["rfans"]); rfStep = 2; render(); startTimer(); });

  const rf2 = document.getElementById("rfreveal");
  if(rf2) rf2.addEventListener("click", () => { stopTimer(); const first = lastWrite[0] || ""; grabWrite(["rfans"]); lastWrite = [first, lastWrite[0] || ""]; noteSaved = false; rfStep = 3; render(); });

  const rf3 = document.getElementById("rfnextq");
  if(rf3) rf3.addEventListener("click", () => {
    const v = verdictOf(checked.filter(Boolean).length);
    record("rfm", v); record("rfs", v);
    startRf();
  });

  const rv = document.getElementById("reveal");
  if(rv) rv.addEventListener("click", () => { stopTimer(); grabWrite(["ans"]); noteSaved = false; revealed = true; render(); });

  const tb = document.getElementById("termbtn");
  if(tb) tb.addEventListener("click", () => { termOn = true; render(); });

  const hb = document.getElementById("hintbtn");
  if(hb) hb.addEventListener("click", () => { hintOn = true; render(); });

  const sb = document.getElementById("shakyobtn");
  if(sb) sb.addEventListener("click", () => { stopTimer(); shakyoOn = true; render(); });

  app.querySelectorAll("[data-chk]").forEach(b => {
    b.addEventListener("click", () => {
      const i = Number(b.dataset.chk);
      checked[i] = !checked[i];
      keepScroll = true;            // ふりかえりを選んでも画面を上に飛ばさない
      render();
    });
  });

  const nx = document.getElementById("nextq");
  if(nx) nx.addEventListener("click", () => {
    if(nx.dataset.noscore){ next(); return; }   // 写経は採点も記録もしない
    const n = checked.filter(Boolean).length;
    const v = verdictOf(n);
    // 連結ドリルは、その型が使った3つのパターンそれぞれに記録を積む
    if(mode === "stack") curSeq.steps.forEach(st => record(st.p, v));
    else record(cur.p, v);
    next();
  });

  const rs = document.getElementById("reset");
  if(rs) rs.addEventListener("click", () => { delAllAsk = true; keepScroll = true; render(); });
  const rsy = document.getElementById("resetyes");
  if(rsy) rsy.addEventListener("click", () => { store.records = []; delAllAsk = false; save(); render(); });
  const rsn = document.getElementById("resetno");
  if(rsn) rsn.addEventListener("click", () => { delAllAsk = false; keepScroll = true; render(); });
}

/* 表示テーマ（ライト / ダーク / 端末に合わせる） */
document.getElementById("theme").addEventListener("click", () => {
  const r = document.documentElement;
  const now = r.getAttribute("data-theme");
  const nextTheme = now === "light" ? "dark" : now === "dark" ? null : "light";
  if(nextTheme) r.setAttribute("data-theme", nextTheme); else r.removeAttribute("data-theme");
});

/* 起動 */
load();
applyFontSize();
render();
</script>

<script>
/* オフラインでも開けるようにする。外部サーバーとのやり取りは一切しない。
   file:// で開いたときは何も起きない（登録が失敗するだけ）。 */
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(() => {});
  });
}
</script>
